<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Me To You Designs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;}

body{
  min-height:100svh;
  height:100svh;
  overflow:hidden;
  background:
    radial-gradient(circle at 82% 28%,rgba(255,211,229,.55) 0,rgba(255,211,229,0) 31%),
    radial-gradient(circle at 8% 58%,rgba(255,235,243,.78) 0,rgba(255,235,243,0) 34%),
    linear-gradient(180deg,#fffafb 0%,#fff9fb 47%,#fdf0f5 100%);
  color:#805e70;
}

/* soft background glow */
body:before{
  content:"";
  position:fixed;
  width:420px;height:300px;
  right:-120px;top:220px;
  background:rgba(255,213,230,.45);
  filter:blur(70px);
  border-radius:50%;
  pointer-events:none;
}
body:after{
  content:"";
  position:fixed;
  width:400px;height:300px;
  left:-160px;bottom:80px;
  background:rgba(255,239,246,.9);
  filter:blur(70px);
  border-radius:50%;
  pointer-events:none;
}

.page{
  position:relative;
  z-index:2;
  width:100%;
  max-width:700px;
  min-height:100svh;
  height:100svh;
  margin:0 auto;
  padding:28px 24px 26px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* SAME TOP LOGO POSITION/SCALE AS THE ORIGINAL */
.logo{
  display:block;
  width:178px;
  height:178px;
  object-fit:contain;
  border-radius:50%;
  margin:0 auto 20px;
  filter:drop-shadow(0 7px 15px rgba(123,77,99,.10));
}

.welcome{
  margin:0;
  font-family:"Great Vibes",cursive;
  font-weight:400;
  font-size:74px;
  line-height:.95;
  letter-spacing:-1px;
  color:#975b79;
  text-align:center;
  white-space:nowrap;
}

.divider{
  display:flex;
  align-items:center;
  justify-content:center;
  width:72%;
  max-width:430px;
  gap:16px;
  margin:20px auto 15px;
}
.divider span{
  flex:1;
  height:1px;
  background:rgba(172,111,139,.34);
}
.divider i{
  font-size:21px;
  color:#bd7997;
}

.tagline{
  margin:0;
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:24px;
  line-height:1.22;
  color:#7d6170;
}

/* ORIGINAL CARD */
.login-card{
  position:relative;
  width:100%;
  max-width:516px;
  margin-top:39px;
  padding:43px 31px 30px;
  border-radius:34px;
  background:rgba(255,255,255,.91);
  border:1px solid rgba(255,255,255,.98);
  box-shadow:0 18px 48px rgba(163,92,124,.13);
  backdrop-filter:blur(9px);
}

.lock{
  position:absolute;
  top:-37px;
  left:50%;
  transform:translateX(-50%);
  width:74px;
  height:74px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fae6ef;
  color:#ae6583;
  font-size:27px;
}

.login-card h2{
  margin:0 0 26px;
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:35px;
  line-height:1;
  font-weight:600;
  color:#795369;
}

label{
  display:block;
  margin:0 0 7px 4px;
  font-family:Poppins,sans-serif;
  font-size:15px;
  font-weight:500;
  color:#815e70;
}

.field{
  position:relative;
  width:100%;
  margin-bottom:17px;
}

.field input{
  width:100%;
  height:55px;
  border:1px solid #ead7df;
  border-radius:18px;
  outline:none;
  background:#fff;
  color:#6f5261;
  font-family:Poppins,sans-serif;
  font-size:15px;
  padding:0 48px 0 17px;
  box-shadow:none;
}

.field input::placeholder{color:#b7abb0}
.field input:focus{
  border-color:#d99ab2;
  box-shadow:0 0 0 3px rgba(217,154,178,.10);
}

.eye{
  position:absolute;
  top:50%;
  right:8px;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  border:0;
  background:transparent;
  color:#a87689;
  font-size:16px;
  cursor:pointer;
}

.sign-in{
  width:100%;
  height:56px;
  border:0;
  border-radius:17px;
  margin-top:3px;
  background:linear-gradient(135deg,#eca8c3,#dd88aa);
  color:white;
  font-family:"Cormorant Garamond",serif;
  font-size:20px;
  font-weight:400;
  cursor:pointer;
  box-shadow:0 10px 22px rgba(190,104,141,.14);
}

.sign-in:disabled{opacity:.65}

.login-message{
  min-height:20px;
  margin:10px 0 0;
  text-align:center;
  font:400 13px Poppins,sans-serif;
}
.login-message.error{color:#b34e6d}
.login-message.success{color:#608b70}

footer{
  width:100%;
  margin-top:18px;
  text-align:center;
}
footer .divider{
  margin-top:0;
  margin-bottom:11px;
}
footer p{
  margin:0;
  font:400 14px Poppins,sans-serif;
  color:#876779;
}

/* little details from original */
.spark{
  position:fixed;
  z-index:1;
  color:#d998b2;
  opacity:.58;
  pointer-events:none;
}
.spark.one{left:12%;top:18%;font-size:18px}
.spark.two{right:13%;top:28%;font-size:17px}
.spark.three{left:18%;bottom:18%;font-size:15px}

@media(max-width:600px){
  .page{padding:27px 24px 23px}
  .logo{width:178px;height:178px;margin-bottom:19px}
  .welcome{font-size:70px}
  .tagline{font-size:23px}
  .login-card{margin-top:38px;padding:43px 27px 29px}
}

@media(max-height:900px) and (max-width:600px){
  .page{padding-top:14px;padding-bottom:10px}
  .logo{width:130px;height:130px;margin-bottom:8px}
  .welcome{font-size:57px;line-height:.9}
  .divider{margin-top:10px;margin-bottom:8px}
  .tagline{font-size:19px;line-height:1.12}
  .login-card{margin-top:25px;padding:34px 20px 18px;border-radius:29px}
  .lock{width:62px;height:62px;top:-31px;font-size:23px}
  .login-card h2{font-size:30px;margin-bottom:17px}
  label{font-size:13px;margin-bottom:4px}
  .field{margin-bottom:10px}
  .field input{height:45px;border-radius:15px;font-size:13px;padding-left:14px}
  .eye{height:32px;width:34px}
  .sign-in{height:45px;border-radius:15px;font-size:18px}
  .login-message{margin-top:5px;font-size:11px;min-height:14px}
  footer{margin-top:8px}
  footer .divider{margin-bottom:5px}
  footer p{font-size:11px}
}
@media(max-height:760px) and (max-width:600px){
  .page{padding-top:8px;padding-bottom:5px}
  .logo{width:108px;height:108px;margin-bottom:5px}
  .welcome{font-size:50px}
  .divider{margin-top:7px;margin-bottom:5px}
  .tagline{font-size:17px}
  .login-card{margin-top:20px;padding-top:30px;padding-bottom:13px}
  .login-card h2{font-size:27px;margin-bottom:12px}
  .lock{width:56px;height:56px;top:-28px;font-size:21px}
  .field input{height:40px}
  .field{margin-bottom:7px}
  .sign-in{height:40px}
  footer{margin-top:5px}
}
@media(max-width:430px){
  .page{padding-left:18px;padding-right:18px}
  .logo{width:176px;height:176px}
  .welcome{font-size:63px}
  .divider{width:80%}
  .tagline{font-size:21px}
  .login-card{padding-left:20px;padding-right:20px}
}
</style>
</head>

<body>

<span class="spark one">✦</span>
<span class="spark two">✦</span>
<span class="spark three">✦</span>

<main class="page">

  <img src="logo.PNG" class="logo" alt="Me To You Designs">

  <h1 class="welcome">Welcome Back</h1>

  <div class="divider">
    <span></span>
    <i class="fa-regular fa-heart"></i>
    <span></span>
  </div>

  <p class="tagline">
    Made with love,<br>
    personalised for every occasion.
  </p>

  <section class="login-card">

    <div class="lock">
      <i class="fa-solid fa-lock"></i>
    </div>

    <h2>Sign In</h2>

    <form id="loginForm">

      <label for="email">Email address</label>
      <div class="field">
        <input id="email" type="email" autocomplete="username"
               placeholder="Enter your email" required>
      </div>

      <label for="password">Password</label>
      <div class="field">
        <input id="password" type="password" autocomplete="current-password"
               placeholder="Enter your password" required>
        <button class="eye" id="togglePassword" type="button" aria-label="Show password">
          <i class="fa-regular fa-eye"></i>
        </button>
      </div>

      <button class="sign-in" id="signInButton" type="submit">Sign In</button>

      <p class="login-message" id="loginMessage"></p>

    </form>

  </section>

  <footer>
    <div class="divider">
      <span></span>
      <i class="fa-regular fa-heart"></i>
      <span></span>
    </div>
    <p>Me To You Designs © 2026</p>
  </footer>

</main>

<script type="module" src="js/login.js"></script>
</body>
</html>
