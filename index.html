<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Me To You Business Suite</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/login.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="background">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <span class="sparkle sparkle1">✦</span>
    <span class="sparkle sparkle2">✦</span>
    <span class="sparkle sparkle3">✦</span>
</div>

<main class="login-page">

    <img src="logo.PNG" class="logo" alt="Me To You Designs">

    <h1>Welcome Back</h1>

    <div class="divider">
        <span></span>
        <i class="fa-regular fa-heart"></i>
        <span></span>
    </div>

    <p class="tagline">
        Made with love,<br>
        personalised for every occasion.
    </p>

    <section class="login-card">

        <div class="lock-icon">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h2>Sign In</h2>

        <form id="loginForm" novalidate>

            <label for="email">Email Address</label>

            <div class="password-wrapper">
                <i class="fa-regular fa-envelope input-icon"></i>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required>
            </div>

            <label for="password" class="password-label">Password</label>

            <div class="password-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

                <button
                    type="button"
                    id="togglePassword"
                    class="eye-button"
                    aria-label="Show password">
                    <i class="fa-regular fa-eye"></i>
                </button>
            </div>

            <label class="show-password">
                <input type="checkbox" id="showPassword">
                <span>Show Password</span>
            </label>

            <button
                type="submit"
                id="signInButton"
                class="sign-in">
                Sign In
            </button>

            <p id="loginMessage" class="login-message" role="alert"></p>

        </form>

    </section>

    <footer>
        <div class="divider footer-divider">
            <span></span>
            <i class="fa-regular fa-heart"></i>
            <span></span>
        </div>

        <p>Me To You Designs © 2026</p>
    </footer>

</main>

<script type="module" src="js/login.js"></script>

</body>
</html>
