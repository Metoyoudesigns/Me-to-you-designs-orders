<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Me To You Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{min-height:100svh;background:radial-gradient(circle at 82% 28%,rgba(255,215,230,.55),transparent 32%),radial-gradient(circle at 8% 70%,rgba(255,237,245,.85),transparent 38%),linear-gradient(180deg,#fffafb 0%,#fff8fa 50%,#fdf0f5 100%);color:#805e70;font-family:Poppins,sans-serif}
body:before,body:after{content:"";position:fixed;border-radius:50%;pointer-events:none;filter:blur(65px);z-index:0}
body:before{width:390px;height:260px;background:#fff;left:-150px;top:12%}
body:after{width:390px;height:280px;background:#ffdce9;right:-150px;top:28%}
.page{position:relative;z-index:2;width:100%;height:100svh;max-width:680px;margin:0 auto;padding:18px 22px 12px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.logo{display:block;width:145px;height:145px;object-fit:contain;margin:0 auto 10px;border-radius:50%;filter:drop-shadow(0 7px 15px rgba(123,77,99,.10))}
.welcome{margin:0;font-family:"Great Vibes",cursive;font-weight:400;font-size:62px;line-height:.92;letter-spacing:-.5px;color:#985d7a;text-align:center;white-space:nowrap}
.divider{width:70%;max-width:410px;display:flex;align-items:center;gap:15px;margin:11px auto 8px}
.divider span{height:1px;flex:1;background:rgba(172,111,139,.34)}
.divider i{font-size:19px;color:#bd7997}
.tagline{margin:0;text-align:center;font-family:"Cormorant Garamond",serif;font-size:20px;line-height:1.12;color:#7d6170}
.login-card{position:relative;width:100%;max-width:500px;margin-top:25px;padding:35px 28px 20px;border-radius:31px;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.98);box-shadow:0 18px 48px rgba(163,92,124,.13);backdrop-filter:blur(10px)}
.lock{position:absolute;top:-31px;left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fae6ef;color:#ae6583;font-size:23px}
.login-card h2{margin:0 0 17px;text-align:center;font-family:"Cormorant Garamond",serif;font-size:30px;line-height:1;font-weight:600;color:#795369}
label{display:block;margin:0 0 5px 3px;font-size:13px;font-weight:500;color:#815e70}
.field{position:relative;width:100%;margin-bottom:11px}
.field input{width:100%;height:45px;border:1px solid #ead7df;border-radius:15px;outline:none;background:#fff;color:#6f5261;font:400 13px Poppins,sans-serif;padding:0 46px 0 14px}
.field input::placeholder{color:#b7abb0}
.field input:focus{border-color:#d99ab2;box-shadow:0 0 0 3px rgba(217,154,178,.10)}
.eye{position:absolute;top:50%;right:7px;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;color:#a87689;font-size:15px;cursor:pointer}
.sign-in{width:100%;height:45px;border:0;border-radius:15px;margin-top:2px;background:linear-gradient(135deg,#eca8c3,#dd88aa);color:#fff;font:400 18px "Cormorant Garamond",serif;cursor:pointer;box-shadow:0 10px 22px rgba(190,104,141,.14)}
.sign-in:disabled{opacity:.65;cursor:wait}
.login-message{min-height:15px;margin:5px 0 0;text-align:center;font:400 11px Poppins,sans-serif}
.login-message.error{color:#b34e6d}.login-message.success{color:#608b70}
footer{width:100%;margin-top:7px;text-align:center}
footer .divider{margin:0 auto 4px}
footer p{margin:0;font:400 11px Poppins,sans-serif;color:#876779}
.spark{position:fixed;z-index:1;color:#d998b2;opacity:.58;pointer-events:none}
.spark.one{left:12%;top:19%;font-size:17px}.spark.two{right:13%;top:31%;font-size:16px}.spark.three{left:18%;bottom:15%;font-size:14px}
.heart{position:fixed;z-index:1;bottom:-30px;color:#d798b0;opacity:.15;font-size:24px;animation:rise 10s linear infinite;pointer-events:none}
.h1{left:10%}.h2{left:34%;animation-delay:3s}.h3{right:29%;animation-delay:6s}.h4{right:8%;animation-delay:1.5s}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-115vh) rotate(12deg)}}
@media(max-height:700px){
.page{padding-top:8px}.logo{width:112px;height:112px;margin-bottom:5px}.welcome{font-size:51px}.divider{margin-top:7px;margin-bottom:5px}.tagline{font-size:17px}.login-card{margin-top:19px;padding-top:31px;padding-bottom:12px}.login-card h2{font-size:27px;margin-bottom:11px}.field{margin-bottom:7px}.field input{height:39px}.sign-in{height:39px}footer{margin-top:4px}
}
</style>
</head>
<body>
<span class="spark one">✦</span><span class="spark two">✦</span><span class="spark three">✦</span>
<span class="heart h1">♡</span><span class="heart h2">♡</span><span class="heart h3">♡</span><span class="heart h4">♡</span>
<main class="page">
<img src="logo.PNG" class="logo" alt="Me To You Designs">
<h1 class="welcome">Welcome Back</h1>
<div class="divider"><span></span><i class="fa-regular fa-heart"></i><span></span></div>
<p class="tagline">Made with love,<br>personalised for every occasion.</p>
<section class="login-card">
<div class="lock"><i class="fa-solid fa-lock"></i></div>
<h2>Sign In</h2>
<form id="loginForm" onsubmit="return false;">
<label for="email">Email address</label>
<div class="field"><input id="email" type="email" autocomplete="username" placeholder="Enter your email" required></div>
<label for="password">Password</label>
<div class="field"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button id="togglePassword" class="eye" type="button" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div>
<button id="signInButton" class="sign-in" type="button">Sign In</button>
<p id="loginMessage" class="login-message"></p>
</form>
</section>
<footer><div class="divider"><span></span><i class="fa-regular fa-heart"></i><span></span></div><p>Me To You Designs © 2026</p></footer>
</main>
<script type="module" src="js/login.js"></script>
</body>
</html>
