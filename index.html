<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Me To You Designs — Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <div class="background" aria-hidden="true">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <span class="sparkle sparkle1">✦</span>
    <span class="sparkle sparkle2">✦</span>
    <span class="sparkle sparkle3">✦</span>

    <span class="heart heart1">♡</span>
    <span class="heart heart2">♡</span>
    <span class="heart heart3">♡</span>
    <span class="heart heart4">♡</span>
    <span class="heart heart5">♡</span>
  </div>

  <main class="login-page">

    <div class="brand">
      <img src="logo.PNG" class="logo" alt="Me To You Designs"
           onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
      <div id="logoFallback" class="logo-fallback">Me To You Designs</div>
    </div>

    <h1>Welcome Back</h1>

    <div class="divider">
      <span></span>
      <i class="fa-regular fa-heart"></i>
      <span></span>
    </div>

    <p class="tagline">
      Made with love,<br>
      personalised for every occasion.
    </p>

    <section class="login-card">
      <div class="lock-icon">
        <i class="fa-solid fa-lock"></i>
      </div>

      <h2>Sign In</h2>

      <form id="loginForm" novalidate>
        <label for="email">Email address</label>
        <div class="input-wrap">
          <i class="fa-regular fa-envelope"></i>
          <input id="email" name="email" type="email"
                 autocomplete="username"
                 placeholder="Enter your email" required>
        </div>

        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-key"></i>
          <input id="password" name="password" type="password"
                 autocomplete="current-password"
                 placeholder="Enter your password" required>
          <button type="button" class="toggle-password" id="togglePassword"
                  aria-label="Show password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>

        <button type="submit" class="sign-in" id="signInButton">
          <span>Sign In</span>
        </button>

        <p id="loginMessage" class="login-message" role="alert"></p>
      </form>
    </section>

    <footer>
      <div class="divider footer-divider">
        <span></span>
        <i class="fa-regular fa-heart"></i>
        <span></span>
      </div>
      <p>Me To You Designs © 2026</p>
    </footer>
  </main>

  <!-- Supabase browser client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
