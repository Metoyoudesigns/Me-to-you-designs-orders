<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders | Me To You Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf6f8;color:#3d3338;font-family:Poppins,sans-serif}
.page{max-width:760px;margin:auto;padding:14px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.back{border:0;background:white;border-radius:12px;width:42px;height:42px;font-size:22px;box-shadow:0 3px 12px rgba(0,0,0,.06);cursor:pointer}
.logo{width:62px;height:62px;object-fit:contain;margin:auto}
.header-spacer{width:42px}
.hero{text-align:center;margin-bottom:14px}
.hero h1{margin:0;font-size:27px}
.hero p{margin:4px 0;color:#8b7b83;font-size:13px}
.search{background:white;padding:10px;border-radius:15px;box-shadow:0 3px 12px rgba(0,0,0,.05);margin-bottom:10px}
.search input{width:100%;border:1px solid #eadfe4;border-radius:11px;padding:11px 13px;font:inherit;font-size:13px;outline:none}
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;border:1px solid #eadfe4;background:white;border-radius:20px;padding:8px 12px;font:600 12px Poppins;color:#6f6067;cursor:pointer}
.filter.active{background:#d98baa;color:white;border-color:#d98baa}
.summary{font-size:12px;color:#8b7b83;margin:2px 2px 10px}
.order{background:white;border-radius:17px;padding:14px;margin-bottom:10px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.order-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.order-number{font-weight:700;color:#d47f9e;font-size:14px}
.customer{font-size:17px;font-weight:600;margin-top:2px}
.status{font-size:11px;font-weight:600;padding:6px 9px;border-radius:14px;white-space:nowrap;background:#f5e9ee;color:#8c6877}
.status.new{background:#fdf0c8;color:#806719}
.status.designing{background:#eadfff;color:#7255a2}
.status.making{background:#e4f0ff;color:#4975a5}
.status.ready{background:#e1f4e8;color:#3d8156}
.status.completed{background:#dff3e4;color:#34734a}
.details{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0;color:#756970;font-size:12px}
.detail strong{color:#44383f}
.balance{font-weight:600}
.actions{display:flex;gap:7px;margin-top:10px}
.action{flex:1;border:0;border-radius:10px;padding:9px 7px;font:600 12px Poppins;cursor:pointer}
.view{background:#f7e5ec;color:#b45f82}.edit{background:#d98baa;color:white}.delete{background:#f2eef0;color:#8a6d78}
.empty{text-align:center;background:white;border-radius:17px;padding:30px 15px;color:#8b7b83;box-shadow:0 3px 12px rgba(0,0,0,.05)}
.loading{text-align:center;padding:25px;color:#8b7b83}
@media(max-width:480px){.page{padding:10px}.hero h1{font-size:24px}.details{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <button class="back" onclick="location.href='dashboard.html'">←</button>
    <img src="logo.PNG" class="logo" alt="Me To You Designs">
    <div class="header-spacer"></div>
  </div>

  <div class="hero">
    <h1>Orders</h1>
    <p>View and manage your customer orders</p>
  </div>

  <div class="search">
    <input id="searchOrders" type="search" placeholder="🔍 Search customer, order number or product...">
  </div>

  <div class="filters" id="filters">
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="New Order">New</button>
    <button class="filter" data-filter="Designing">Mock Up</button>
    <button class="filter" data-filter="Making">Making</button>
    <button class="filter" data-filter="Ready">Ready</button>
    <button class="filter" data-filter="Completed">Completed</button>
  </div>

  <div class="summary" id="summary">Loading orders...</div>
  <div id="ordersContainer"><div class="loading">Loading your orders…</div></div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://critutqwakaepgxgpkml.supabase.co";
const SUPABASE_KEY = "sb_publishable_KtXAtIRgtZADPODLn7inRw_vC6rBPFb";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const container = document.getElementById("ordersContainer");
const searchInput = document.getElementById("searchOrders");
const summary = document.getElementById("summary");
let orders = [];
let currentFilter = "all";

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function money(value){
  const n = Number(value) || 0;
  return "£" + n.toFixed(2);
}

function formatDate(value){
  if(!value) return "No due date";
  const d = new Date(value + (String(value).length === 10 ? "T00:00:00" : ""));
  if(Number.isNaN(d.getTime())) return "No due date";
  return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
}

function statusClass(status){
  return String(status || "").toLowerCase().replace(/\s+/g,"-");
}

function getProduct(order){
  if(Array.isArray(order.items) && order.items.length){
    return order.items.map(i => i.product).filter(Boolean).join(", ") || "Order items";
  }
  return order.product || "Order";
}

function getTotal(order){
  return Number(order.orderTotal ?? order.order_total ?? order.total ?? 0) || 0;
}

function getPaid(order){
  return Number(order.totalPaid ?? order.total_paid ?? 0) || 0;
}

function getBalance(order){
  const explicit = order.remainingBalance ?? order.remaining_balance;
  if(explicit !== undefined && explicit !== null) return Number(explicit) || 0;
  return Math.max(0,getTotal(order)-getPaid(order));
}

function matches(order){
  const status = order.orderStatus || "";
  if(currentFilter !== "all" && status !== currentFilter) return false;

  const q = searchInput.value.trim().toLowerCase();
  if(!q) return true;

  const haystack = [
    order.orderNumber,
    order.customerName,
    order.customerContact,
    order.socialUsername,
    order.orderSource,
    order.orderNotes,
    getProduct(order)
  ].join(" ").toLowerCase();

  return haystack.includes(q);
}

function render(){
  const visible = orders.filter(matches);
  summary.textContent = `${visible.length} order${visible.length === 1 ? "" : "s"}`;

  if(!visible.length){
    container.innerHTML = `<div class="empty"><div style="font-size:30px">📦</div><strong>No orders found</strong><br><span>Try another search or filter.</span></div>`;
    return;
  }

  container.innerHTML = visible.map(order => {
    const status = order.orderStatus || "New Order";
    const total = getTotal(order);
    const paid = getPaid(order);
    const balance = getBalance(order);

    return `
      <article class="order">
        <div class="order-top">
          <div>
            <div class="order-number">${escapeHtml(order.orderNumber || "MTYD-????")}</div>
            <div class="customer">${escapeHtml(order.customerName || "Unnamed customer")}</div>
          </div>
          <span class="status ${statusClass(status)}">${escapeHtml(status)}</span>
        </div>

        <div class="details">
          <div class="detail">🛍️ <strong>${escapeHtml(getProduct(order))}</strong></div>
          <div class="detail">📅 <strong>${escapeHtml(formatDate(order.dateNeeded))}</strong></div>
          <div class="detail">💷 Total: <strong>${money(total)}</strong></div>
          <div class="detail">💳 Paid: <strong>${money(paid)}</strong></div>
          <div class="detail balance">💰 Balance: <strong>${money(balance)}</strong></div>
          <div class="detail">📍 <strong>${escapeHtml(order.orderSource || "Other")}</strong></div>
        </div>

        <div class="actions">
          <button class="action view" data-action="view" data-id="${escapeHtml(order.id)}">👁 View</button>
          <button class="action edit" data-action="edit" data-id="${escapeHtml(order.id)}">✏️ Edit</button>
          <button class="action delete" data-action="delete" data-id="${escapeHtml(order.id)}">🗑 Delete</button>
        </div>
      </article>
    `;
  }).join("");
}

async function checkLogin(){
  const {data,error} = await supabase.auth.getSession();
  if(error || !data.session){
    location.href = "index.html";
    return false;
  }
  return true;
}

async function loadOrders(){
  const {data,error} = await supabase
    .from("orders")
    .select("*")
    .order("orderDate",{ascending:false});

  if(error){
    console.error(error);
    container.innerHTML = `<div class="empty">Unable to load orders.<br><small>${escapeHtml(error.message)}</small></div>`;
    summary.textContent = "Orders could not be loaded";
    return;
  }

  orders = data || [];
  render();
}

document.querySelectorAll(".filter").forEach(button=>{
  button.addEventListener("click",()=>{
    document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");
    currentFilter = button.dataset.filter;
    render();
  });
});

searchInput.addEventListener("input",render);

container.addEventListener("click",async event=>{
  const button = event.target.closest("button[data-action]");
  if(!button) return;

  const id = button.dataset.id;
  const order = orders.find(o => String(o.id) === String(id));
  if(!order) return;

  if(button.dataset.action === "view"){
    alert(
      `${order.orderNumber || ""}\\n` +
      `${order.customerName || ""}\\n\\n` +
      `Product: ${getProduct(order)}\\n` +
      `Due: ${formatDate(order.dateNeeded)}\\n` +
      `Total: ${money(getTotal(order))}\\n` +
      `Paid: ${money(getPaid(order))}\\n` +
      `Balance: ${money(getBalance(order))}\\n` +
      `Status: ${order.orderStatus || "New Order"}`
    );
  }

  if(button.dataset.action === "edit"){
    // Uses the existing order id so the future edit page can update this exact record.
    location.href = `create-order.html?edit=${encodeURIComponent(id)}`;
  }

  if(button.dataset.action === "delete"){
    if(!confirm(`Delete ${order.orderNumber || "this order"}?\\n\\nThis cannot be undone.`)) return;

    const {error} = await supabase.from("orders").delete().eq("id",id);

    if(error){
      alert("Could not delete the order.\\n\\n" + error.message);
      return;
    }

    await loadOrders();
  }
});

supabase
  .channel("orders-page")
  .on("postgres_changes",{event:"*",schema:"public",table:"orders"},loadOrders)
  .subscribe();

setInterval(loadOrders,10000);

(async()=>{
  if(await checkLogin()) await loadOrders();
})();
</script>
</body>
</html>
