<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orders | Me To You Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#c978a0;--pink2:#e8b7cb;--bg:#fbf2f7;--text:#62465a;--muted:#8b7181;--white:#fff;--line:#efd8e3;--shadow:0 8px 24px rgba(105,62,89,.10)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff7fb 0,#faeef5 100%);color:var(--text);font-family:Poppins,sans-serif;padding-bottom:90px}
.top{background:rgba(255,255,255,.94);padding:6px 12px 7px;text-align:center;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.logo{width:48px;height:48px;border-radius:50%;object-fit:cover;box-shadow:0 3px 10px rgba(0,0,0,.10);background:#fff}.brand{font-family:'Dancing Script',cursive;font-size:30px;color:var(--pink);margin:3px 0 0}
.wrap{max-width:900px;margin:auto;padding:10px 14px 18px}.back{display:inline-block;text-decoration:none;color:var(--pink);font-weight:600;margin:2px 0 8px;font-size:13px}
.hero{background:#fff;border-radius:20px;padding:13px;box-shadow:var(--shadow);border:1px solid #f2dfe8}.hero h1{margin:0;font-size:23px}.hero p{margin:2px 0 10px;color:var(--muted)}
.searchWrap{margin-top:14px}
.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:15px;background:#fff;font:inherit;color:var(--text);outline:none}
.search:focus{border-color:var(--pink)}
.statusTabs{display:flex;gap:8px;margin-top:14px;overflow-x:auto;overflow-y:hidden;padding:2px 1px 7px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.statusTabs::-webkit-scrollbar{display:none}
.statusTab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 17px;color:var(--text);font:600 14px Poppins,sans-serif;white-space:nowrap;cursor:pointer}
.statusTab.active{background:var(--pink);border-color:var(--pink);color:#fff}
.orders{margin-top:16px;display:grid;gap:14px}.order{background:#fff;border:1px solid var(--line);border-radius:21px;padding:17px;box-shadow:var(--shadow)}
.orderTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.num{font-size:19px;font-weight:700;color:#684b5f}.name{font-size:17px;font-weight:600;margin-top:3px}.due{font-size:13px;color:var(--muted);margin-top:3px}
.badge{white-space:nowrap;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:700;background:#f4e4ec;color:#8c5874}.badge.new{background:#f5e8ee}.badge.mock{background:#f1e7f5}.badge.making{background:#fff0d7;color:#946b22}.badge.ready{background:#e5f3e9;color:#3e7a50}.badge.completed{background:#e5eef7;color:#416987}
.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;color:#6f5968;font-size:13px}.detail{background:#fcf7fa;border-radius:12px;padding:10px}.detail b{display:block;color:#8b6c7e;font-size:11px;margin-bottom:2px}
.money{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:13px;font-size:13px}.money strong{color:var(--pink);font-size:15px}
.actions{display:flex;gap:8px;margin-top:13px}.btn{flex:1;border:0;border-radius:12px;padding:11px 10px;font:600 13px Poppins;cursor:pointer}.btn.primary{background:var(--pink);color:#fff}.btn.light{background:#f8eaf1;color:#7a5369}
.empty{background:#fff;border:1px dashed #dfbdcf;border-radius:20px;text-align:center;padding:42px 18px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:5px}
.error{background:#fff0f0;border:1px solid #edc3c3;color:#9b4b4b;border-radius:16px;padding:14px;margin-top:14px;display:none}.loading{text-align:center;padding:30px;color:var(--muted)}
@media(max-width:650px){.details{grid-template-columns:1fr}.hero h1{font-size:27px}.statusTab{padding:9px 15px;font-size:14px}}


.deleteOrderBtn{
  border:1px solid #e3c4d2;
  background:#fff;
  color:#8b4f6d;
  border-radius:12px;
  padding:9px 12px;
  font:600 13px Poppins,sans-serif;
  cursor:pointer;
}
.deleteOrderBtn:hover{border-color:#c97aa1;background:#fff7fb}

</style>

<style>
.orderModal{position:fixed;inset:0;background:rgba(54,34,45,.58);z-index:999;display:flex;align-items:flex-end;justify-content:center}
.orderSheet{background:#fff;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:25px 25px 0 0;padding:20px;color:#62465a;position:relative}
.closeModal{position:absolute;right:14px;top:14px;border:0;background:#f6e8ef;border-radius:50%;width:40px;height:40px;font-size:24px;color:#81596c}
.orderSheet h2{color:#a65c7e;margin:0 45px 2px 0}.orderSheet h3{margin:0 0 12px}
.viewBox{background:#fcf7fa;border-radius:14px;padding:11px;margin:8px 0;font-size:12px}.viewBox>b{display:block;color:#a65c7e;margin-bottom:4px}.viewBox p{margin:5px 0}
.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.photoGrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px}
.editFull{width:100%;border:0;border-radius:13px;padding:14px;background:#c978a0;color:#fff;font:700 14px Poppins;margin-top:10px}
</style>

<style>
.editGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.editField{display:flex;flex-direction:column;gap:5px}.editField.full{grid-column:1/-1}.editField label{font-size:11px;font-weight:700;color:#9a6b83}.editField input,.editField select,.editField textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff;color:var(--text);font:inherit;font-size:13px}.editField textarea{min-height:80px;resize:vertical}.editItems{display:grid;gap:10px}.editItem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}.editItemGrid{display:grid;grid-template-columns:1.4fr .6fr .7fr .8fr;gap:8px}.editActions{display:flex;gap:8px;margin-top:12px}.editActions button{flex:1;border:0;border-radius:12px;padding:12px;font:700 13px Poppins;cursor:pointer}.saveEdit{background:var(--pink);color:#fff}.cancelEdit{background:#f8eaf1;color:#7a5369}.addItemEdit{border:1px dashed #d7a5bc;background:#fff;color:#9b5f7e;border-radius:12px;padding:10px;font:600 13px Poppins;cursor:pointer;width:100%;margin-top:8px}.removeEditItem{border:0;background:#fff0f5;color:#a05275;border-radius:9px;padding:7px 9px;font:600 12px Poppins;cursor:pointer;margin-top:7px}.personalBox{margin-top:8px}.personalBox.hidden{display:none}@media(max-width:650px){.editGrid{grid-template-columns:1fr}.editField.full{grid-column:auto}.editItemGrid{grid-template-columns:1fr 1fr}}

.viewItems{display:grid;gap:10px;margin-top:8px}.viewItemCard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin:0}.viewItems .viewItemCard + .viewItemCard{margin-top:2px}.viewItemTitle{font-weight:700;color:#6b4b61;font-size:14px;margin-bottom:7px}.viewItemLine{font-size:12px;line-height:1.55;margin-top:3px}.viewItemPersonal{margin-top:7px;padding:8px 9px;background:#f8e7ef;border-radius:9px;color:#8d5573;font-size:12px}
</style>
</head>
<body>
<header class="top">
<img class="logo" src="logo.png.PNG" onerror="if(this.dataset.try2){this.onerror=null;this.src='logo.png';}else{this.dataset.try2='1';this.src='logo.PNG';}" alt="Me To You Designs">

</header>

<main class="wrap">
<a class="back" href="dashboard.html">← Back to Dashboard</a>

<section class="hero">
<h1>📦 Orders</h1>
<p>View and manage your customer orders</p>

<div class="searchWrap">
<input id="searchOrders" class="search" placeholder="🔍 Search customer, order number or product...">
</div>

<div class="statusTabs" id="statusTabs">
<button class="statusTab active" data-filter="all">All</button>
<button class="statusTab" data-filter="New Order">New</button>
<button class="statusTab" data-filter="Mock Up">Mock Up</button>
<button class="statusTab" data-filter="Making">Making</button>
<button class="statusTab" data-filter="Ready">Ready</button>
<button class="statusTab" data-filter="Completed">Completed</button>
</div>

<div id="error" class="error"></div>
</section>

<section id="ordersContainer" class="orders"><div class="loading">Loading orders…</div></section>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://critutqwakaepgxgpkml.supabase.co","sb_publishable_KtXAtIRgtZADPODLn7inRw_vC6rBPFb");
const $=id=>document.getElementById(id);let orders=[],filter="all";

function v(o,...ks){for(const k of ks)if(o?.[k]!==undefined&&o[k]!==null&&o[k]!=="")return o[k];return""}
function esc(x){return String(x??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
function money(x){return"£"+(Number(x)||0).toFixed(2)}
function status(o){return v(o,"orderStatus","status","order_status")||"New Order"}
function total(o){return Number(v(o,"orderTotal","total","total_amount","totalAmount","order_total"))||0}
function paid(o){return Number(v(o,"totalPaid","paid","deposit","deposit_amount","depositAmount"))||0}
function balance(o){const b=v(o,"remainingBalance","balance","remaining","remaining_balance");return b!==""?Number(b):Math.max(0,total(o)-paid(o))}
function items(o){return Array.isArray(o.items)?o.items:[]}
function itemPersonalised(i){return String(i?.personalised??i?.personalized??"No").toLowerCase()==="yes"?"Yes":"No"}
function product(o){return items(o).map(i=>i.product||i.itemName||i.item||"").filter(Boolean).join(", ")||v(o,"product","productOrdered","product_ordered")||"—"}
function due(o){return v(o,"dateNeeded","date_needed","dueDate","due_date","dateNeededBy","date_needed_by")}
function dateText(x){if(!x)return"Not set";const d=new Date(String(x).slice(0,10)+"T00:00:00");return isNaN(d)?"Not set":d.toLocaleDateString("en-GB")}
function days(x){if(!x)return Infinity;const d=new Date(String(x).slice(0,10)+"T00:00:00"),n=new Date();n.setHours(0,0,0,0);return Math.ceil((d-n)/86400000)}
function dueSoon(o){const d=days(due(o));return d>=0&&d<=3}
function dueWeek(o){const d=days(due(o));return d>=0&&d<=7}
function paymentDue(o){return balance(o)>0}
function sc(s){s=s.toLowerCase();return s.includes("mock")||s.includes("design")?"mock":s.includes("mak")?"making":s.includes("ready")?"ready":s.includes("complet")?"completed":"new"}

function render(){
 const q=$("searchOrders").value.trim().toLowerCase();
 const list=orders.filter(o=>{
  const hay=[v(o,"orderNumber","order_number","orderNo","order_no","id"),v(o,"customerName","customer_name","name"),product(o),v(o,"customerContact","customer_contact","contact")].join(" ").toLowerCase();
  const s=status(o);
  return(!q||hay.includes(q))&&(filter==="all"||filter==="due"&&dueSoon(o)||filter==="week"&&dueWeek(o)||filter==="payment"&&paymentDue(o)||filter===s);
 });
if(!list.length){$("ordersContainer").innerHTML='<div class="empty">📦<br><strong>No orders match this filter.</strong><br>Try another filter or search.</div>';return}
 $("ordersContainer").innerHTML=list.map(o=>{
  const num=v(o,"orderNumber","order_number","orderNo","order_no")||"Order",name=v(o,"customerName","customer_name","name")||"Unnamed customer",s=status(o),d=due(o),n=days(d);
  const dl=n===Infinity?"No due date":n<0?Math.abs(n)+" day(s) overdue":n===0?"Due today":n===1?"Due tomorrow":n+" day(s)";
  return `<article class="order"><div class="orderTop"><div><div class="num">${esc(num)}</div><div class="name">${esc(name)}</div><div class="due">📅 ${esc(dateText(d))} · ${esc(dl)}</div></div><span class="badge ${sc(s)}">${esc(s.replace("Designing","Mock Up"))}</span></div>
  <div class="details"><div class="detail"><b>PRODUCT</b>${esc(product(o))}</div><div class="detail"><b>ORDERED FROM</b>${esc(v(o,"orderSource","order_source","source")||"—")}</div><div class="detail"><b>TOTAL</b>${money(total(o))}</div><div class="detail"><b>PAYMENT</b>${balance(o)>0?money(balance(o))+" due":"Paid in full"}</div></div>
  <div class="money"><span>Paid: <strong>${money(paid(o))}</strong></span><span>Balance: <strong>${money(balance(o))}</strong></span></div>
  <div class="actions"><button type="button" class="deleteOrderBtn" data-order-id="${esc(o.id)}">🗑️ Delete</button><button class="btn view" data-view="${esc(o.id)}">👁 View</button><button class="btn edit" data-edit="${esc(o.id)}">✏️ Edit</button></div></article>`;
 }).join("");
}

function itemPersonalised(i){return String(i?.personalised||"No")==="Yes"?"Yes":"No"}
function editModal(o){
 const modal=document.createElement("div");modal.className="orderModal";
 const its=items(o).length?items(o):[{product:"",quantity:1,unitPrice:0,itemTotal:0,size:"",colour:"",personalised:"No",personalisation:""}];
 modal.innerHTML=`<div class="orderSheet"><button class="closeModal">×</button><h2>✏️ Edit Order</h2><h3>${esc(v(o,"orderNumber","order_number"))} — ${esc(v(o,"customerName","customer_name"))}</h3>
 <div class="editGrid">
 <div class="editField"><label>Customer Name</label><input id="e_customerName" value="${esc(v(o,"customerName","customer_name"))}"></div>
 <div class="editField"><label>Contact</label><input id="e_customerContact" value="${esc(v(o,"customerContact","customer_contact"))}"></div>
 <div class="editField"><label>Ordered From</label><input id="e_orderSource" value="${esc(v(o,"orderSource","order_source"))}"></div>
 <div class="editField"><label>Social Username</label><input id="e_socialUsername" value="${esc(v(o,"socialUsername"))}"></div>
 <div class="editField"><label>Order Date</label><input type="date" id="e_orderDate" value="${esc(String(v(o,"orderDate","order_date")).slice(0,10))}"></div>
 <div class="editField"><label>Date Needed</label><input type="date" id="e_dateNeeded" value="${esc(String(due(o)).slice(0,10))}"></div>
 <div class="editField"><label>Order Status</label><select id="e_orderStatus"><option>New Order</option><option>Mock Up</option><option>Making</option><option>Ready</option><option>Completed</option><option>Cancelled</option></select></div>
 <div class="editField"><label>Delivery Method</label><input id="e_deliveryMethod" value="${esc(v(o,"deliveryMethod","delivery_method"))}"></div>
 <div class="editField"><label>Total (£)</label><input type="number" step="0.01" id="e_total" value="${total(o).toFixed(2)}"></div>
 <div class="editField"><label>Total Paid (£)</label><input type="number" step="0.01" id="e_paid" value="${paid(o).toFixed(2)}"></div>
 <div class="editField full"><label>Notes</label><textarea id="e_notes">${esc(v(o,"orderNotes","notes"))}</textarea></div>
 <div class="editField"><label>Address 1</label><input id="e_address1" value="${esc(v(o,"address1"))}"></div>
 <div class="editField"><label>Address 2</label><input id="e_address2" value="${esc(v(o,"address2"))}"></div>
 <div class="editField"><label>Town</label><input id="e_town" value="${esc(v(o,"town"))}"></div>
 <div class="editField"><label>County</label><input id="e_county" value="${esc(v(o,"county"))}"></div>
 <div class="editField"><label>Postcode</label><input id="e_postcode" value="${esc(v(o,"postcode"))}"></div>
 </div>
 <div class="viewBox" style="margin-top:14px"><b>📦 Items</b><div id="editItems" class="editItems"></div><button type="button" class="addItemEdit" id="addEditItem">＋ Add Item</button></div>
 <div class="editActions"><button type="button" class="cancelEdit">Cancel</button><button type="button" class="saveEdit">💗 Save Changes</button></div>
 </div>`;
 document.body.appendChild(modal);
 const statusSel=modal.querySelector("#e_orderStatus");statusSel.value=status(o);
 const itemsBox=modal.querySelector("#editItems");
 function renderEditItems(){
   itemsBox.innerHTML=its.map((i,idx)=>`<div class="editItem" data-index="${idx}"><div class="editItemGrid">
    <div class="editField"><label>Product</label><input class="ei-product" value="${esc(i.product||"")}"></div>
    <div class="editField"><label>Qty</label><input type="number" min="1" class="ei-qty" value="${Number(i.quantity)||1}"></div>
    <div class="editField"><label>Price (£)</label><input type="number" step="0.01" class="ei-price" value="${Number(i.unitPrice??i.price)||0}"></div>
    <div class="editField"><label>Size</label><input class="ei-size" value="${esc(i.size||"")}"></div>
    <div class="editField"><label>Colour</label><input class="ei-colour" value="${esc(i.colour||"")}"></div>
    <div class="editField"><label>Personalised?</label><select class="ei-personalised"><option value="No">No</option><option value="Yes">Yes</option></select></div>
    <div class="editField full personalBox ${itemPersonalised(i)==="Yes"?"":"hidden"}"><label>What personalisation?</label><input class="ei-personalisation" value="${esc(i.personalisation||"")}" placeholder="e.g. Paddy"></div>
    </div><button type="button" class="removeEditItem">🗑️ Remove item</button></div>`).join("");
   itemsBox.querySelectorAll(".editItem").forEach((card,idx)=>{const sel=card.querySelector(".ei-personalised");sel.value=itemPersonalised(its[idx]);sel.addEventListener("change",()=>card.querySelector(".personalBox").classList.toggle("hidden",sel.value!=="Yes"));});
 }
 renderEditItems();
 modal.querySelector("#addEditItem").onclick=()=>{its.push({product:"",quantity:1,unitPrice:0,size:"",colour:"",personalised:"No",personalisation:""});renderEditItems();};
 modal.querySelector(".closeModal").onclick=()=>modal.remove();
 modal.querySelector(".cancelEdit").onclick=()=>modal.remove();
 modal.querySelector(".saveEdit").onclick=async()=>{
   const saveBtn=modal.querySelector(".saveEdit");saveBtn.disabled=true;saveBtn.textContent="Saving…";
   try{
    const editedItems=[...itemsBox.querySelectorAll(".editItem")].map(card=>{const qty=Number(card.querySelector(".ei-qty").value)||1,price=Number(card.querySelector(".ei-price").value)||0,personalised=card.querySelector(".ei-personalised").value;return{product:card.querySelector(".ei-product").value.trim(),quantity:qty,unitPrice:price,itemTotal:qty*price,size:card.querySelector(".ei-size").value.trim(),colour:card.querySelector(".ei-colour").value.trim(),personalised,personalisation:personalised==="Yes"?card.querySelector(".ei-personalisation").value.trim():""};});
    const newTotal=editedItems.reduce((a,i)=>a+i.itemTotal,0);const newPaid=Number(modal.querySelector("#e_paid").value)||0;const newBalance=Math.max(0,newTotal-newPaid);const ps=newPaid<=0?"Not Paid":newPaid>=newTotal?"Paid in Full":"Deposit Paid";
    const patch={customerName:modal.querySelector("#e_customerName").value.trim(),customerContact:modal.querySelector("#e_customerContact").value.trim(),orderSource:modal.querySelector("#e_orderSource").value.trim(),socialUsername:modal.querySelector("#e_socialUsername").value.trim(),orderDate:modal.querySelector("#e_orderDate").value,dateNeeded:modal.querySelector("#e_dateNeeded").value,orderStatus:modal.querySelector("#e_orderStatus").value,deliveryMethod:modal.querySelector("#e_deliveryMethod").value.trim(),orderTotal:newTotal,totalPaid:newPaid,remainingBalance:newBalance,paymentStatus:ps,orderNotes:modal.querySelector("#e_notes").value,address1:modal.querySelector("#e_address1").value,address2:modal.querySelector("#e_address2").value,town:modal.querySelector("#e_town").value,county:modal.querySelector("#e_county").value,postcode:modal.querySelector("#e_postcode").value,items:editedItems,updatedAt:new Date().toISOString()};
    const{error}=await supabase.from("orders").update(patch).eq("id",o.id);if(error)throw error;modal.remove();await load();alert("✅ Order updated successfully.");
   }catch(err){console.error(err);alert("Could not update the order.\\n\\n"+err.message);saveBtn.disabled=false;saveBtn.textContent="💗 Save Changes";}
 };
}

function show(o){
 const photos=[...(Array.isArray(o.customerPhotos)?o.customerPhotos:[]),...(Array.isArray(o.mockupPhotos)?o.mockupPhotos:[])];
 const its=items(o),ps=Array.isArray(o.payments)?o.payments:[];
 const modal=document.createElement("div");modal.className="orderModal";
 modal.innerHTML=`<div class="orderSheet"><button class="closeModal">×</button><h2>${esc(v(o,"orderNumber","order_number"))}</h2><h3>${esc(v(o,"customerName","customer_name"))}</h3>
 <div class="viewBox"><b>📅 Due</b><span>${esc(dateText(due(o)))}</span></div>
 <div class="viewBox"><b>✨ Status</b><span>${esc(status(o).replace("Designing","Mock Up"))}</span></div>
 <div class="viewBox"><b>👤 Contact</b><span>${esc(v(o,"customerContact","customer_contact")||"—")}</span></div>
 <div class="viewBox"><b>📱 Ordered From</b><span>${esc(v(o,"orderSource","order_source")||"—")} ${esc(v(o,"socialUsername")||"")}</span></div>
 <div class="viewBox"><b>📦 Items</b><div class="viewItems">${its.length?its.map((i,n)=>`<div class="viewItemCard"><div class="viewItemTitle">${n+1}. ${esc(i.product||"Item")}</div><div class="viewItemLine"><strong>Quantity:</strong> ${esc(i.quantity??1)} &nbsp; <strong>Price:</strong> ${money(i.unitPrice??i.price)} &nbsp; <strong>Total:</strong> ${money(i.itemTotal??((Number(i.unitPrice||i.price)||0)*(Number(i.quantity)||1)))}</div>${i.size?`<div class="viewItemLine"><strong>Size:</strong> ${esc(i.size)}</div>`:""}${i.colour?`<div class="viewItemLine"><strong>Colour:</strong> ${esc(i.colour)}</div>`:""}<div class="viewItemLine"><strong>Personalised:</strong> ${esc(itemPersonalised(i))}</div>${String(itemPersonalised(i)).toLowerCase()==="yes"&&i.personalisation?`<div class="viewItemPersonal"><strong>Personalisation:</strong> ${esc(i.personalisation)}</div>`:""}</div>`).join(""):"<div class='viewItemCard'>No items recorded.</div>"}</div></div>
 <div class="viewBox"><b>💷 Payment</b><span>Total ${money(total(o))} · Paid ${money(paid(o))} · Balance ${money(balance(o))}<br>${esc(v(o,"paymentStatus","payment_status")||"Not Paid")}</span></div>
 <div class="viewBox"><b>🚚 Delivery</b><span>${esc(v(o,"deliveryMethod","delivery_method")||"—")}<br>${esc([o.address1,o.address2,o.town,o.county,o.postcode].filter(Boolean).join(", "))}</span></div>
 <div class="viewBox"><b>📝 Notes</b><span style="white-space:pre-wrap">${esc(v(o,"orderNotes","notes")||"No notes.")}</span></div>
 ${ps.length?`<div class="viewBox"><b>📜 Payments</b><span>${ps.map(p=>`${esc(p.date||"")} — ${money(p.amount)} — ${esc(p.method||"")}`).join("<br>")}</span></div>`:""}
 ${photos.length?`<div class="viewBox"><b>🖼 Images</b><div class="photoGrid">${photos.map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}"></a>`).join("")}</div></div>`:""}
 <button class="editFull">✏️ Edit This Order</button></div>`;
 document.body.appendChild(modal);
 modal.querySelector(".closeModal").onclick=()=>modal.remove();
 modal.querySelector(".editFull").onclick=()=>{ modal.remove(); editModal(o); };
}

$("ordersContainer").addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 const id=b.dataset.view||b.dataset.edit||b.dataset.orderId;const o=orders.find(x=>String(x.id)===String(id));if(!o)return;
 if(b.dataset.view){show(o);return;}
 if(b.dataset.edit){editModal(o);return;}
 if(b.dataset.orderId){
   if(!confirm("Delete this order?\n\nThis will permanently remove the order and its saved details."))return;
   b.disabled=true;const original=b.textContent;b.textContent="Deleting…";
   try{
    const orderId=o.id;
    if(!orderId) throw new Error("This order has no database ID, so it cannot be deleted.");
    const{error}=await supabase.from("orders").delete().eq("id",orderId);
    if(error) throw error;
    // Re-number the remaining orders from the oldest order upwards so there are no gaps.
    await renumberOrders();
    await load();
    alert("✅ Order deleted. Remaining orders have been re-numbered.");
   }catch(err){
    console.error("Delete order error:",err);
    alert("Could not delete the order.\n\n"+(err?.message||String(err)));
    b.disabled=false;b.textContent=original;
   }
 }
});
$("searchOrders").addEventListener("input",render);
document.querySelectorAll(".statusTab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".statusTab").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()}));

async function renumberOrders(){
 const{data,error}=await supabase.from("orders").select("id,orderNumber,createdAt,created_at");
 if(error) throw error;
 const rows=(data||[]).sort((a,b)=>{
   const ad=a.createdAt||a.created_at||"";
   const bd=b.createdAt||b.created_at||"";
   return new Date(ad)-new Date(bd);
 });
 for(let i=0;i<rows.length;i++){
   const wanted=`MTYD-${String(i+1).padStart(4,"0")}`;
   if(rows[i].orderNumber!==wanted){
     const{error:updateError}=await supabase.from("orders").update({orderNumber:wanted,updatedAt:new Date().toISOString()}).eq("id",rows[i].id);
     if(updateError) throw updateError;
   }
 }
}

async function load(){
 const{data,error}=await supabase.from("orders").select("*");
 if(error){$("ordersContainer").innerHTML='<div class="empty">Unable to load orders.<br>'+esc(error.message)+'</div>';return}
 orders=(data||[]).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));render();
}
(async()=>{const{data}=await supabase.auth.getSession();if(!data.session){location.href="index.html";return}await load()})();
</script>
