<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orders | Me To You Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#c978a0;--pink2:#e8b7cb;--bg:#fbf2f7;--text:#62465a;--muted:#8b7181;--white:#fff;--line:#efd8e3;--shadow:0 8px 24px rgba(105,62,89,.10)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff7fb 0,#faeef5 100%);color:var(--text);font-family:Poppins,sans-serif;padding-bottom:90px}
.top{background:rgba(255,255,255,.92);padding:18px 16px 14px;text-align:center;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.logo{width:74px;height:74px;border-radius:50%;object-fit:cover;box-shadow:0 5px 16px rgba(0,0,0,.12);background:#fff}.brand{font-family:'Dancing Script',cursive;font-size:30px;color:var(--pink);margin:3px 0 0}
.wrap{max-width:900px;margin:auto;padding:18px}.back{display:inline-block;text-decoration:none;color:var(--pink);font-weight:600;margin:4px 0 16px}
.hero{background:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow);border:1px solid #f2dfe8}.hero h1{margin:0;font-size:27px}.hero p{margin:5px 0 16px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff8fb;border:1px solid var(--line);border-radius:17px;padding:13px;text-align:center}.stat b{display:block;font-size:24px;color:var(--pink)}.stat span{font-size:12px;color:var(--muted)}
.tools{margin-top:14px;display:grid;grid-template-columns:1fr 170px;gap:10px}.search,.filter{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit;color:var(--text);outline:none}.search:focus,.filter:focus{border-color:var(--pink)}
.orders{margin-top:16px;display:grid;gap:14px}.order{background:#fff;border:1px solid var(--line);border-radius:21px;padding:17px;box-shadow:var(--shadow)}
.orderTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.num{font-size:19px;font-weight:700;color:#684b5f}.name{font-size:17px;font-weight:600;margin-top:3px}.due{font-size:13px;color:var(--muted);margin-top:3px}
.badge{white-space:nowrap;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:700;background:#f4e4ec;color:#8c5874}.badge.new{background:#f5e8ee}.badge.mock{background:#f1e7f5}.badge.making{background:#fff0d7;color:#946b22}.badge.ready{background:#e5f3e9;color:#3e7a50}.badge.completed{background:#e5eef7;color:#416987}
.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;color:#6f5968;font-size:13px}.detail{background:#fcf7fa;border-radius:12px;padding:10px}.detail b{display:block;color:#8b6c7e;font-size:11px;margin-bottom:2px}
.money{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:13px;font-size:13px}.money strong{color:var(--pink);font-size:15px}
.actions{display:flex;gap:8px;margin-top:13px}.btn{flex:1;border:0;border-radius:12px;padding:11px 10px;font:600 13px Poppins;cursor:pointer}.btn.primary{background:var(--pink);color:#fff}.btn.light{background:#f8eaf1;color:#7a5369}
.empty{background:#fff;border:1px dashed #dfbdcf;border-radius:20px;text-align:center;padding:42px 18px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:5px}
.error{background:#fff0f0;border:1px solid #edc3c3;color:#9b4b4b;border-radius:16px;padding:14px;margin-top:14px;display:none}.loading{text-align:center;padding:30px;color:var(--muted)}
@media(max-width:650px){.tools{grid-template-columns:1fr}.details{grid-template-columns:1fr}.brand{font-size:27px}}
</style>
</head>
<body>
<header class="top">
<img class="logo" src="logo.PNG" onerror="this.onerror=null;this.src='logo.png'" alt="Me To You Designs">
<div class="brand">Me To You Designs</div>
</header>

<main class="wrap">
<a class="back" href="dashboard.html">← Back to Dashboard</a>
<section class="hero">
<h1>📦 Orders</h1>
<p>View and manage your customer orders.</p>
<div class="stats">
<div class="stat"><b id="total">0</b><span>Total Orders</span></div>
<div class="stat"><b id="pending">0</b><span>Pending</span></div>
<div class="stat"><b id="due">0</b><span>Due This Week</span></div>
</div>
<div class="tools">
<input id="search" class="search" placeholder="🔍 Search customer, order number or product...">
<select id="filter" class="filter">
<option value="all">All</option>
<option value="New Order">New</option>
<option value="Mock Up">Mock Up</option>
<option value="Making">Making</option>
<option value="Ready">Ready</option>
<option value="Completed">Completed</option>
</select>
</div>
<div id="error" class="error"></div>
</section>
<section id="orders" class="orders"><div class="loading">Loading orders…</div></section>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL="https://critutqwakaepgxgpkml.supabase.co";
const SUPABASE_KEY="sb_publishable_KtXAtIRgtZADPODLn7inRw_vC6rBPFb";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

const state={orders:[]};
const $=id=>document.getElementById(id);

function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function val(o,...keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k]}return ''}

function statusValue(o){
 return String(val(o,'status','order_status','orderStatus')||'New Order')
   .replace(/^Designing$/i,'Mock Up');
}
function statusClass(s){
 s=String(s).toLowerCase();
 if(s.includes('mock')||s.includes('design'))return'mock';
 if(s.includes('mak'))return'making';
 if(s.includes('ready'))return'ready';
 if(s.includes('complet'))return'completed';
 return'new';
}
function money(n){return '£'+(Number(n)||0).toFixed(2)}
function dateText(d){
 if(!d)return 'No due date';
 const raw=String(d).slice(0,10),x=new Date(raw+'T00:00:00');
 return isNaN(x)?String(d):x.toLocaleDateString('en-GB');
}
function dueThisWeek(d){
 if(!d)return false;
 const now=new Date();now.setHours(0,0,0,0);
 const day=(now.getDay()+6)%7;
 const start=new Date(now);start.setDate(now.getDate()-day);
 const end=new Date(start);end.setDate(start.getDate()+6);
 const x=new Date(String(d).slice(0,10)+'T00:00:00');
 return x>=start&&x<=end;
}
function productText(o){
 const direct=val(o,'product','product_ordered','productOrdered','product_name');
 if(direct)return direct;
 const items=val(o,'items','order_items');
 if(Array.isArray(items)&&items.length)return items.map(x=>x.product||x.itemName||x.item||'Item').join(', ');
 return 'Product not specified';
}

function render(){
 const q=$('search').value.trim().toLowerCase();
 const f=$('filter').value;
 const list=state.orders.filter(o=>{
   const s=statusValue(o);
   const hay=[
     val(o,'order_number','orderNumber','order_no','orderNo','id'),
     val(o,'customer_name','customerName','name'),
     productText(o),
     val(o,'contact','phone','email','customer_contact','customerContact')
   ].join(' ').toLowerCase();
   return (!q||hay.includes(q))&&(f==='all'||s===f);
 });

 $('total').textContent=state.orders.length;
 $('pending').textContent=state.orders.filter(o=>!statusValue(o).toLowerCase().includes('completed')).length;
 $('due').textContent=state.orders.filter(o=>dueThisWeek(val(o,'date_needed_by','due_date','dueDate','dateNeededBy','date_needed'))).length;

 if(!list.length){
   $('orders').innerHTML='<div class="empty"><strong>📦 No orders found</strong>Try changing your search or status filter.</div>';
   return;
 }

 $('orders').innerHTML=list.map(o=>{
   const num=val(o,'order_number','orderNumber','order_no','orderNo')||'Order';
   const name=val(o,'customer_name','customerName','name')||'Unnamed customer';
   const product=productText(o);
   const status=statusValue(o);
   const due=val(o,'date_needed_by','due_date','dueDate','dateNeededBy','date_needed');
   const total=Number(val(o,'total','total_amount','totalAmount','price','order_total','orderTotal'))||0;
   const paid=Number(val(o,'deposit','deposit_amount','depositAmount','paid','total_paid','totalPaid'))||0;
   const balanceVal=val(o,'balance','remaining','remaining_balance','remainingBalance');
   const balance=balanceVal!==''?Number(balanceVal):Math.max(0,total-paid);
   const source=val(o,'where_ordered_from','source','ordered_from','platform','order_source','orderSource')||'—';
   const delivery=val(o,'delivery_method','deliveryMethod','delivery')||'—';

   return `<article class="order">
     <div class="orderTop">
       <div>
         <div class="num">${esc(num)}</div>
         <div class="name">${esc(name)}</div>
         <div class="due">📅 Due: ${esc(dateText(due))}</div>
       </div>
       <span class="badge ${statusClass(status)}">${esc(status)}</span>
     </div>
     <div class="details">
       <div class="detail"><b>PRODUCT</b>${esc(product)}</div>
       <div class="detail"><b>ORDERED FROM</b>${esc(source)}</div>
       <div class="detail"><b>DELIVERY</b>${esc(delivery)}</div>
       <div class="detail"><b>TOTAL</b>${money(total)}</div>
     </div>
     <div class="money"><span>Paid: <strong>${money(paid)}</strong></span><span>Balance: <strong>${money(balance)}</strong></span></div>
     <div class="actions">
       <button class="btn light" data-view="${esc(num)}">👁️ View</button>
       <button class="btn primary" data-edit="${esc(num)}">✏️ Edit</button>
     </div>
   </article>`;
 }).join('');

 document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>viewOrder(b.dataset.view)));
 document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>editOrder(b.dataset.edit)));
}

function viewOrder(n){
 const o=state.orders.find(x=>String(val(x,'order_number','orderNumber','order_no','orderNo','id'))===String(n));
 if(!o)return;
 alert(Object.entries(o).map(([k,v])=>k+': '+(typeof v==='object'?JSON.stringify(v):v)).join('\n'));
}
function editOrder(n){
 location.href='create-order.html?order='+encodeURIComponent(n);
}

async function load(){
 try{
   // IMPORTANT: select * only. Do not request orderDate/order_date/etc.
   // The previous Orders page was failing because it explicitly requested
   // a column called orders.orderDate which does not exist.
   const {data,error}=await supabase.from('orders').select('*');
   if(error)throw error;
   state.orders=Array.isArray(data)?data:[];
   render();
 }catch(e){
   console.error(e);
   $('error').style.display='block';
   $('error').textContent='Could not load orders: '+(e.message||e);
   state.orders=[];
   render();
 }
}

$('search').addEventListener('input',render);
$('filter').addEventListener('change',render);
load();
</script>
</body>
</html>
