<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orders</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#c978a0;--pink2:#e8b7cb;--bg:#fbf2f7;--text:#62465a;--muted:#8b7181;--white:#fff;--line:#efd8e3;--soft:#fcf7fa;--shadow:0 8px 24px rgba(105,62,89,.10)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff8fb 0,#faeef5 100%);color:var(--text);font-family:Poppins,sans-serif;padding-bottom:80px}
.top{background:#fff;padding:12px;text-align:center;border-bottom:1px solid var(--line)}.logo{width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 3px 12px rgba(0,0,0,.1)}
.wrap{max-width:900px;margin:auto;padding:18px 14px}.back{display:inline-block;text-decoration:none;color:var(--pink);font-weight:600;margin-bottom:12px}.hero,.order{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.hero{padding:20px}.hero h1{margin:0;font-size:34px}.hero p{margin:3px 0 16px;color:var(--muted);font-size:18px}
.search{width:100%;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff;font:inherit;color:var(--text);outline:none}.statusTabs{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}.statusTabs::-webkit-scrollbar{display:none}.statusTab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 18px;color:var(--text);font:600 14px Poppins;white-space:nowrap}.statusTab.active{background:var(--pink);border-color:var(--pink);color:#fff}
.orders{display:grid;gap:16px;margin-top:18px}.order{padding:18px}.orderTop{display:flex;justify-content:space-between;gap:12px}.num{font-size:23px;font-weight:700}.name{font-size:20px;font-weight:600;margin-top:3px}.due{color:var(--muted);font-size:14px;margin-top:5px}.badge{white-space:nowrap;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:700;background:#f4e4ec;color:#8c5874;height:max-content}.badge.making{background:#fff0d7;color:#946b22}.badge.ready{background:#e5f3e9;color:#3e7a50}.badge.completed{background:#e5eef7;color:#416987}.badge.mock{background:#f1e7f5}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.detail,.viewBox{background:var(--soft);border-radius:14px;padding:13px}.detail b,.viewBox>b{display:block;color:#95627d;font-size:12px;margin-bottom:4px}.money{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:14px;padding-top:13px}.money strong{color:var(--pink);font-size:16px}.actions{display:flex;gap:9px;margin-top:14px}.btn,.deleteOrderBtn{flex:1;border-radius:12px;padding:12px;border:1px solid var(--line);font:700 13px Poppins;cursor:pointer}.btn{background:#f8eaf1;color:#715266}.deleteOrderBtn{background:#fff;color:#8b4f6d}.btn:hover,.deleteOrderBtn:hover{border-color:var(--pink)}.empty,.loading{padding:45px;text-align:center;color:var(--muted)}.error{display:none;margin-top:14px;background:#fff0f0;color:#9b4b4b;border:1px solid #edc3c3;border-radius:14px;padding:14px}
.modal{position:fixed;inset:0;background:rgba(54,34,45,.58);z-index:1000;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:min(900px,100%);max-height:94vh;overflow:auto;border-radius:25px 25px 0 0;padding:20px}.close{float:right;border:0;background:#f6e8ef;border-radius:50%;width:40px;height:40px;font-size:24px;color:#81596c}.sheet h2{color:#a65c7e;margin:0 50px 12px 0}.viewItemCard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:10px}.viewItemTitle{font-weight:700;font-size:15px}.itemLine{font-size:13px;line-height:1.6;margin-top:4px}.personal{margin-top:8px;padding:9px;background:#f8e7ef;border-radius:10px;color:#8d5573;font-size:13px}
.editGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#95627d}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;font:inherit;color:var(--text);background:#fff}.field textarea{min-height:90px}.editItems{display:grid;gap:10px}.editItem{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.editItemGrid{display:grid;grid-template-columns:1.5fr .6fr .8fr .8fr;gap:8px}.hidden{display:none}.removeItem{margin-top:8px;border:0;background:#fff0f5;color:#a05275;border-radius:9px;padding:7px 10px;font:600 12px Poppins}.addItem,.save,.cancel{border:0;border-radius:12px;padding:12px;font:700 13px Poppins;cursor:pointer}.addItem{width:100%;margin-top:9px;background:#fff;color:#9b5f7e;border:1px dashed #d7a5bc}.editActions{display:flex;gap:9px;margin-top:14px}.save,.cancel{flex:1}.save{background:var(--pink);color:#fff}.cancel{background:#f8eaf1;color:#7a5369}
@media(max-width:650px){.details{grid-template-columns:1fr}.editGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.editItemGrid{grid-template-columns:1fr 1fr}.hero h1{font-size:29px}.hero p{font-size:16px}}
</style>
</head>
<body>
<header class="top"><img class="logo" src="logo.png.PNG" onerror="this.onerror=null;this.src='logo.png';" alt="Logo"></header>
<main class="wrap">
<a class="back" href="dashboard.html">← Back to Dashboard</a>
<section class="hero">
<h1>📦 Orders</h1><p>View and manage your customer orders</p>
<input id="searchOrders" class="search" placeholder="🔍 Search customer, order number or product...">
<div class="statusTabs">
<button class="statusTab active" data-filter="all">All</button><button class="statusTab" data-filter="New Order">New</button><button class="statusTab" data-filter="Mock Up">Mock Up</button><button class="statusTab" data-filter="Making">Making</button><button class="statusTab" data-filter="Ready">Ready</button><button class="statusTab" data-filter="Completed">Completed</button>
</div><div id="error" class="error"></div>
</section>
<section id="ordersContainer" class="orders"><div class="loading">Loading orders…</div></section>
</main>
<script>
const SUPABASE_URL='https://critutqwakaepgxgpkml.supabase.co';
const SUPABASE_KEY='sb_publishable_KtXAtIRgtZADPODLn7inRw_vC6rBPFb';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let orders=[];let filter='all';
const $=id=>document.getElementById(id);
function v(o,...keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k]}return ''}
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(x){return '£'+(Number(x)||0).toFixed(2)}
function getStatus(o){return v(o,'orderStatus','status','order_status')||'New Order'}
function getItems(o){return Array.isArray(o.items)?o.items:[]}
function getTotal(o){return Number(v(o,'orderTotal','total','total_amount','totalAmount','order_total'))||0}
function getPaid(o){return Number(v(o,'totalPaid','paid','deposit','deposit_amount','depositAmount'))||0}
function getBalance(o){const b=v(o,'remainingBalance','balance','remaining','remaining_balance');return b!==''?Number(b):Math.max(0,getTotal(o)-getPaid(o))}
function getDue(o){return v(o,'dateNeeded','date_needed','dueDate','due_date','dateNeededBy','date_needed_by')}
function getProduct(o){const a=getItems(o).map(i=>i.product||i.itemName||i.item).filter(Boolean);return a.join(', ')||v(o,'product','productOrdered','product_ordered')||'—'}
function dateText(x){if(!x)return'No due date';const d=new Date(String(x).slice(0,10)+'T00:00:00');return isNaN(d)?'No due date':d.toLocaleDateString('en-GB')}
function days(x){if(!x)return Infinity;const d=new Date(String(x).slice(0,10)+'T00:00:00');const n=new Date();n.setHours(0,0,0,0);return Math.ceil((d-n)/86400000)}
function badgeClass(s){s=s.toLowerCase();if(s.includes('mock'))return'mock';if(s.includes('mak'))return'making';if(s.includes('ready'))return'ready';if(s.includes('complet'))return'completed';return'new'}
function isPersonalised(i){return String(i?.personalised??i?.personalized??'No').toLowerCase()==='yes'?'Yes':'No'}
function itemTotal(i){return Number(i?.itemTotal??((Number(i?.unitPrice??i?.price)||0)*(Number(i?.quantity)||1)))||0}
function render(){
 const q=$('searchOrders').value.trim().toLowerCase();
 const list=orders.filter(o=>{const hay=[v(o,'orderNumber','order_number','orderNo','order_no','id'),v(o,'customerName','customer_name','name'),getProduct(o),v(o,'customerContact','customer_contact','contact')].join(' ').toLowerCase();return(!q||hay.includes(q))&&(filter==='all'||getStatus(o)===filter)});
 if(!list.length){$('ordersContainer').innerHTML='<div class="empty">📦<br><strong>No orders found.</strong></div>';return}
 $('ordersContainer').innerHTML=list.map(o=>{const num=v(o,'orderNumber','order_number','orderNo','order_no')||'Order';const name=v(o,'customerName','customer_name','name')||'Unnamed customer';const s=getStatus(o);const d=getDue(o);const n=days(d);const desc=n===Infinity?'No due date':n<0?Math.abs(n)+' day(s) overdue':n===0?'Due today':n===1?'Due tomorrow':n+' day(s) remaining';return `<article class="order"><div class="orderTop"><div><div class="num">${esc(num)}</div><div class="name">${esc(name)}</div><div class="due">📅 ${esc(dateText(d))} · ${esc(desc)}</div></div><span class="badge ${badgeClass(s)}">${esc(s)}</span></div><div class="details"><div class="detail"><b>PRODUCT</b>${esc(getProduct(o))}</div><div class="detail"><b>ORDERED FROM</b>${esc(v(o,'orderSource','order_source','source')||'—')}</div><div class="detail"><b>TOTAL</b>${money(getTotal(o))}</div><div class="detail"><b>PAYMENT</b>${getBalance(o)>0?money(getBalance(o))+' due':'Paid in full'}</div></div><div class="money"><span>Paid: <strong>${money(getPaid(o))}</strong></span><span>Balance: <strong>${money(getBalance(o))}</strong></span></div><div class="actions"><button class="deleteOrderBtn" data-delete="${esc(o.id)}">🗑️ Delete</button><button class="btn" data-view="${esc(o.id)}">👁 View</button><button class="btn" data-edit="${esc(o.id)}">✏️ Edit</button></div></article>`}).join('');
}
function openView(o){
 const m=document.createElement('div');m.className='modal';const its=getItems(o);const payments=Array.isArray(o.payments)?o.payments:[];
 m.innerHTML=`<div class="sheet"><button class="close">×</button><h2>${esc(v(o,'orderNumber','order_number'))} — ${esc(v(o,'customerName','customer_name'))}</h2><div class="viewBox"><b>📅 Due</b>${esc(dateText(getDue(o)))}</div><div class="viewBox"><b>✨ Status</b>${esc(getStatus(o))}</div><div class="viewBox"><b>👤 Contact</b>${esc(v(o,'customerContact','customer_contact')||'—')}</div><div class="viewBox"><b>📱 Ordered From</b>${esc(v(o,'orderSource','order_source')||'—')} ${esc(v(o,'socialUsername')||'')}</div><div class="viewBox"><b>📦 Items</b><div>${its.length?its.map((i,n)=>`<div class="viewItemCard"><div class="viewItemTitle">${n+1}. ${esc(i.product||'Item')}</div><div class="itemLine"><strong>Quantity:</strong> ${esc(i.quantity??1)} &nbsp; <strong>Price:</strong> ${money(i.unitPrice??i.price)} &nbsp; <strong>Total:</strong> ${money(itemTotal(i))}</div>${i.size?`<div class="itemLine"><strong>Size:</strong> ${esc(i.size)}</div>`:''}${i.colour?`<div class="itemLine"><strong>Colour:</strong> ${esc(i.colour)}</div>`:''}<div class="itemLine"><strong>Personalised:</strong> ${isPersonalised(i)}</div>${isPersonalised(i)==='Yes'&&i.personalisation?`<div class="personal"><strong>Personalisation:</strong> ${esc(i.personalisation)}</div>`:''}</div>`).join(''):'<div class="viewItemCard">No items recorded.</div>'}</div></div><div class="viewBox"><b>💷 Payment</b>Total ${money(getTotal(o))} · Paid ${money(getPaid(o))} · Balance ${money(getBalance(o))}<br>${esc(v(o,'paymentStatus','payment_status')||'Not Paid')}</div><div class="viewBox"><b>🚚 Delivery</b>${esc(v(o,'deliveryMethod','delivery_method')||'—')}<br>${esc([o.address1,o.address2,o.town,o.county,o.postcode].filter(Boolean).join(', '))}</div><div class="viewBox"><b>📝 Notes</b><span style="white-space:pre-wrap">${esc(v(o,'orderNotes','notes')||'No notes.')}</span></div>${payments.length?`<div class="viewBox"><b>📜 Payments</b>${payments.map(p=>`${esc(p.date||'')} — ${money(p.amount)} — ${esc(p.method||'')}`).join('<br>')}</div>`:''}<button class="save" id="viewEdit">✏️ Edit This Order</button></div>`;
 document.body.appendChild(m);m.querySelector('.close').onclick=()=>m.remove();m.querySelector('#viewEdit').onclick=()=>{m.remove();openEdit(o)};
}
function openEdit(o){
 const m=document.createElement('div');m.className='modal';let its=JSON.parse(JSON.stringify(getItems(o)));if(!its.length)its=[{product:'',quantity:1,unitPrice:0,size:'',colour:'',personalised:'No',personalisation:''}];
 m.innerHTML=`<div class="sheet"><button class="close">×</button><h2>✏️ Edit Order</h2><div class="editGrid"><div class="field"><label>Customer Name</label><input id="eName" value="${esc(v(o,'customerName','customer_name'))}"></div><div class="field"><label>Contact</label><input id="eContact" value="${esc(v(o,'customerContact','customer_contact'))}"></div><div class="field"><label>Ordered From</label><input id="eSource" value="${esc(v(o,'orderSource','order_source'))}"></div><div class="field"><label>Social Username</label><input id="eSocial" value="${esc(v(o,'socialUsername'))}"></div><div class="field"><label>Order Date</label><input type="date" id="eOrderDate" value="${esc(String(v(o,'orderDate','order_date')).slice(0,10))}"></div><div class="field"><label>Date Needed</label><input type="date" id="eDue" value="${esc(String(getDue(o)).slice(0,10))}"></div><div class="field"><label>Status</label><select id="eStatus"><option>New Order</option><option>Mock Up</option><option>Making</option><option>Ready</option><option>Completed</option><option>Cancelled</option></select></div><div class="field"><label>Delivery Method</label><input id="eDelivery" value="${esc(v(o,'deliveryMethod','delivery_method'))}"></div><div class="field"><label>Total Paid (£)</label><input type="number" step="0.01" id="ePaid" value="${getPaid(o).toFixed(2)}"></div><div class="field full"><label>Notes</label><textarea id="eNotes">${esc(v(o,'orderNotes','notes'))}</textarea></div></div><div class="viewBox" style="margin-top:14px"><b>📦 Items</b><div id="editItems" class="editItems"></div><button class="addItem" id="addItem">＋ Add Item</button></div><div class="editActions"><button class="cancel" id="cancel">Cancel</button><button class="save" id="save">💗 Save Changes</button></div></div>`;
 document.body.appendChild(m);m.querySelector('#eStatus').value=getStatus(o);
 function renderItems(){m.querySelector('#editItems').innerHTML=its.map((i,n)=>`<div class="editItem"><div class="editItemGrid"><div class="field"><label>Product</label><input class="p" value="${esc(i.product||'')}"></div><div class="field"><label>Qty</label><input type="number" min="1" class="q" value="${Number(i.quantity)||1}"></div><div class="field"><label>Price (£)</label><input type="number" step="0.01" class="pr" value="${Number(i.unitPrice??i.price)||0}"></div><div class="field"><label>Size</label><input class="sz" value="${esc(i.size||'')}"></div><div class="field"><label>Colour</label><input class="co" value="${esc(i.colour||'')}"></div><div class="field"><label>Personalised?</label><select class="pe"><option value="No">No</option><option value="Yes">Yes</option></select></div><div class="field full pers ${isPersonalised(i)==='Yes'?'':'hidden'}"><label>What personalisation?</label><input class="pi" value="${esc(i.personalisation||'')}" placeholder="e.g. Paddy"></div></div><button class="removeItem" type="button">🗑️ Remove item</button></div>`).join('');
 m.querySelectorAll('.editItem').forEach((card,idx)=>{const sel=card.querySelector('.pe');sel.value=isPersonalised(its[idx]);sel.onchange=()=>card.querySelector('.pers').classList.toggle('hidden',sel.value!=='Yes');card.querySelector('.removeItem').onclick=()=>{if(its.length===1){alert('You must have at least one item.');return}its.splice(idx,1);renderItems()}})
 }
 renderItems();m.querySelector('#addItem').onclick=()=>{its.push({product:'',quantity:1,unitPrice:0,size:'',colour:'',personalised:'No',personalisation:''});renderItems()};m.querySelector('.close').onclick=()=>m.remove();m.querySelector('#cancel').onclick=()=>m.remove();
 m.querySelector('#save').onclick=async()=>{const btn=m.querySelector('#save');btn.disabled=true;btn.textContent='Saving…';try{const edited=[...m.querySelectorAll('.editItem')].map(c=>{const q=Number(c.querySelector('.q').value)||1,p=Number(c.querySelector('.pr').value)||0,pe=c.querySelector('.pe').value;return{product:c.querySelector('.p').value.trim(),quantity:q,unitPrice:p,itemTotal:q*p,size:c.querySelector('.sz').value.trim(),colour:c.querySelector('.co').value.trim(),personalised:pe,personalisation:pe==='Yes'?c.querySelector('.pi').value.trim():''}});const total=edited.reduce((a,i)=>a+i.itemTotal,0);const paid=Number(m.querySelector('#ePaid').value)||0;const patch={customerName:m.querySelector('#eName').value.trim(),customerContact:m.querySelector('#eContact').value.trim(),orderSource:m.querySelector('#eSource').value.trim(),socialUsername:m.querySelector('#eSocial').value.trim(),orderDate:m.querySelector('#eOrderDate').value,dateNeeded:m.querySelector('#eDue').value,orderStatus:m.querySelector('#eStatus').value,deliveryMethod:m.querySelector('#eDelivery').value.trim(),orderTotal:total,totalPaid:paid,remainingBalance:Math.max(0,total-paid),paymentStatus:paid<=0?'Not Paid':paid>=total?'Paid in Full':'Deposit Paid',orderNotes:m.querySelector('#eNotes').value,items:edited,updatedAt:new Date().toISOString()};const r=await supabase.from('orders').update(patch).eq('id',o.id);if(r.error)throw r.error;m.remove();await load();alert('✅ Order updated successfully.')}catch(err){console.error(err);alert('Could not update the order.\n\n'+(err.message||err));btn.disabled=false;btn.textContent='💗 Save Changes'}};
}
async function deleteOrder(id,button){if(!confirm('Delete this order?\n\nThis will permanently remove the order and its saved details.'))return;button.disabled=true;button.textContent='Deleting…';try{const r=await supabase.from('orders').delete().eq('id',id);if(r.error)throw r.error;await renumberOrders();await load();alert('✅ Order deleted. Remaining orders have been re-numbered.')}catch(err){console.error(err);alert('Could not delete the order.\n\n'+(err.message||err));button.disabled=false;button.textContent='🗑️ Delete'}}
async function renumberOrders(){const r=await supabase.from('orders').select('*');if(r.error)throw r.error;const rows=(r.data||[]).sort((a,b)=>new Date(a.createdAt||a.created_at||0)-new Date(b.createdAt||b.created_at||0));for(let i=0;i<rows.length;i++){const wanted='MTYD-'+String(i+1).padStart(4,'0');if(v(rows[i],'orderNumber','order_number')!==wanted){const p={orderNumber:wanted,updatedAt:new Date().toISOString()};let u=await supabase.from('orders').update(p).eq('id',rows[i].id);if(u.error)throw u.error}}}
$('ordersContainer').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.view||b.dataset.edit||b.dataset.delete;if(!id)return;const o=orders.find(x=>String(x.id)===String(id));if(!o)return;if(b.dataset.view)openView(o);else if(b.dataset.edit)openEdit(o);else deleteOrder(id,b)});
$('searchOrders').addEventListener('input',render);document.querySelectorAll('.statusTab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.statusTab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
async function load(){const box=$('ordersContainer');box.innerHTML='<div class="loading">Loading orders…</div>';try{const r=await supabase.from('orders').select('*');if(r.error)throw r.error;orders=(r.data||[]).sort((a,b)=>new Date(b.createdAt||b.created_at||0)-new Date(a.createdAt||a.created_at||0));render()}catch(err){console.error('Load orders error:',err);box.innerHTML='<div class="empty"><strong>Unable to load orders.</strong><br><br>'+esc(err.message||err)+'<br><br>Refresh the page and try again.</div>'}}
(async()=>{try{const r=await supabase.auth.getSession();if(r.error)throw r.error;if(!r.data.session){location.href='index.html';return}await load()}catch(err){console.error(err);$('ordersContainer').innerHTML='<div class="empty"><strong>Unable to open orders.</strong><br><br>'+esc(err.message||err)+'</div>'}})();
</script>
</body>
</html>
