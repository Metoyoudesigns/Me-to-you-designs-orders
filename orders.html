<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Orders | Me To You Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf5f8;color:#4a3a43;font-family:Poppins,sans-serif}
.page{max-width:900px;margin:auto;padding:10px 12px 45px}
.top{text-align:center;background:#fff;margin:-10px -12px 15px;padding:12px;border-bottom:1px solid #efd8e3}
.logo{width:78px;height:78px;object-fit:contain;border-radius:50%}
.back{display:inline-block;color:#bd7398;text-decoration:none;font-weight:700;margin:3px 0 12px}
.hero,.orderCard{background:#fff;border:1px solid #efd8e3;border-radius:22px;padding:17px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.hero h1{margin:0;font-size:30px}
.hero p{margin:4px 0 15px;color:#8d7c85}
.search{width:100%;border:1.5px solid #e6cad6;border-radius:13px;padding:12px;background:#fff;font:inherit;font-size:14px;outline:none}
.filters{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{border:1.5px solid #e6cad6;background:#fff;color:#62465a;border-radius:22px;padding:10px 18px;font:600 13px Poppins;cursor:pointer;flex:0 0 auto}
.filter.active{background:#c978a0;border-color:#c978a0;color:#fff}
.summary{color:#8d7c85;font-size:13px;margin:13px 3px 8px}
.orderCard{margin-bottom:12px}
.orderTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.orderNo{font-size:21px;font-weight:700}
.customer{font-size:18px;font-weight:700;margin-top:1px}
.status{padding:7px 11px;border-radius:17px;font-size:11px;font-weight:700;background:#f6e9ef;color:#8d6877;white-space:nowrap}
.status.making{background:#fff0cf;color:#92701f}
.status.ready{background:#e1f4e8;color:#3d8156}
.status.completed{background:#dff3e4;color:#34734a}
.status.designing{background:#eadfff;color:#7255a2}
.meta{margin-top:9px;color:#75656d;font-size:13px;line-height:1.65}
.actions{display:flex;gap:8px;margin-top:13px}
.actions button{flex:1;border:0;border-radius:12px;padding:11px 7px;font:700 13px Poppins;cursor:pointer}
.view{background:#f7e5ec;color:#a85e7f}
.edit{background:#c978a0;color:#fff}
.invoice{background:#eee4f7;color:#76549b}
.delete{background:#f3ecef;color:#8a6877}
.loading,.empty{text-align:center;color:#8d7c85;padding:40px 15px}
.empty{background:#fff;border:1px solid #efd8e3;border-radius:20px}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(62,43,56,.48);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.editor{width:min(900px,100%);max-height:94vh;overflow:auto;background:#faf5f8;border-radius:25px 25px 0 0;padding:15px 12px 30px}
.editorHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 3px 12px}
.editorHead h2{margin:0;color:#62465a;font-size:22px}
.close{border:0;background:#fff;width:42px;height:42px;border-radius:50%;font-size:25px;color:#62465a;cursor:pointer}
.editCard{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 3px 12px rgba(0,0,0,.05)}
.editCard h3{margin:0 0 11px;color:#b86c8d;font-size:18px}
label{display:block;font-weight:600;font-size:12px;margin:9px 0 4px;color:#6f5963}
input,select,textarea{width:100%;border:1.5px solid #e6cad6;border-radius:12px;padding:10px 11px;background:#fff;font:inherit;font-size:14px;color:#3e3439;outline:none}
textarea{min-height:85px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.itemCard{border:1px solid #eadbe1;border-radius:15px;padding:13px;margin-bottom:10px;background:#fffafb}
.itemTitle{font-weight:700;color:#8f5773;margin-bottom:8px}
.itemGrid{display:grid;grid-template-columns:1.3fr .6fr .8fr;gap:8px}
.itemGrid .wide{grid-column:1/-1}
.removeItem{margin-top:9px;border:0;border-radius:10px;padding:9px 12px;background:#f2e7eb;color:#8d6877;font-weight:600;cursor:pointer}
.addItem{width:100%;border:0;border-radius:12px;padding:12px;background:#d287a5;color:#fff;font-weight:700;cursor:pointer}
.pbox{display:none}
.paymentRow{padding:9px 0;border-bottom:1px solid #eee0e6;font-size:12px}
.totals{background:#faf3f6;border-radius:13px;padding:12px;margin-top:10px;font-weight:600;color:#7d6170}
.editorActions{display:flex;gap:9px}
.editorActions button{flex:1;border:0;border-radius:13px;padding:14px;font:700 14px Poppins;cursor:pointer}
.save{background:#b96d8d;color:#fff}
.cancel{background:#f2e7eb;color:#765968}
.danger{background:#fff0f2;color:#a05275}
.msg{display:none;padding:11px;border-radius:12px;background:#fff0f0;color:#9b4b4b;margin-top:10px;font-size:13px}

/* Photos */
.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}
.photoWrap{position:relative}
.photoGrid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid #eadbe1;background:#f8f0f4;cursor:pointer}
.photoRemove{position:absolute;top:6px;right:6px;border:0;background:#fff;color:#a05275;border-radius:50%;width:29px;height:29px;font-size:19px;line-height:29px;padding:0;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.14);cursor:pointer}
.photoHint{font-size:11px;color:#9a8990;margin-top:6px}
.uploadBox{background:#faf3f6;border:1px dashed #d9b8c8;border-radius:14px;padding:12px;margin-top:10px}
.uploadBox input{background:#fff}
.noPhotos{padding:12px;background:#faf3f6;border-radius:12px;color:#8d7c85;font-size:12px;margin-top:7px}

/* Full-screen image viewer */
.imageViewer{position:fixed;inset:0;background:rgba(20,14,18,.94);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.imageViewer img{max-width:96vw;max-height:90vh;object-fit:contain;border-radius:8px}
.imageViewerClose{position:absolute;top:15px;right:15px;border:0;background:#fff;color:#62465a;width:44px;height:44px;border-radius:50%;font-size:27px;cursor:pointer}

/* View order */
.viewItem{background:#faf3f6;border:1px solid #eadbe1;border-radius:14px;padding:13px;margin:8px 0}
.viewItem strong{color:#8f5773}
.viewLine{font-size:13px;line-height:1.75}

@media(max-width:560px){
 .grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .itemGrid{grid-template-columns:1fr 1fr}
 .itemGrid .wide{grid-column:1/-1}
 .editorActions{flex-direction:column}
 .photoGrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="page">
<header class="top">
<img src="logo.PNG" class="logo" alt="Logo">
</header>

<a class="back" href="dashboard.html">← Back to Dashboard</a>

<section class="hero">
<h1>📦 Orders</h1>
<p>View and manage your customer orders</p>
<input id="search" class="search" type="search" placeholder="🔍 Search customer, order number or product...">
<div class="filters">
<button class="filter active" data-filter="all">All</button>
<button class="filter" data-filter="New Order">New</button>
<button class="filter" data-filter="Designing">Mock Up</button>
<button class="filter" data-filter="Making">Making</button>
<button class="filter" data-filter="Ready">Ready</button>
<button class="filter" data-filter="Completed">Completed</button>
</div>
</section>

<div id="summary" class="summary">Loading orders…</div>
<div id="orders"><div class="loading">Loading orders…</div></div>
</div>

<div id="editorRoot"></div>

<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase=createClient(
 "https://critutqwakaepgxgpkml.supabase.co",
 "sb_publishable_KtXAtIRgtZADPODLn7inRw_vC6rBPFb"
);

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));

const money=v=>"£"+(Number(v)||0).toFixed(2);

let orders=[];
let filter="all";
let editing=null;
let payments=[];

function getItems(o){return Array.isArray(o?.items)?o.items:[]}

function firstValue(o,keys,fallback=""){
 for(const key of keys){
  const value=o?.[key];
  if(value!==undefined&&value!==null&&String(value).trim()!=="")return value;
 }
 return fallback;
}
function orderNumber(o){return firstValue(o,["order_number","orderNumber","orderNo","order_no"])}
function customerName(o){return firstValue(o,["customer_name","customerName","customer","name","customer_full_name"],firstValue(o?.customer||{},["name","customer_name","customerName"]))}
function customerContact(o){return firstValue(o,["customer_contact","customerContact","contact","phone","email","customer_phone","customer_email"])}
function orderSource(o){return firstValue(o,["order_source","orderSource","source"])}
function socialUsername(o){return firstValue(o,["social_username","socialUsername","username"])}
function orderNotes(o){return firstValue(o,["order_notes","orderNotes","notes"])}
function orderStatus(o){return firstValue(o,["order_status","orderStatus","status"],"New Order")}
function dateNeeded(o){return firstValue(o,["date_needed","dateNeeded","neededBy","date_needed_by"],null)}
function orderDate(o){return firstValue(o,["order_date","orderDate","created_at","createdAt","date"],null)}
function orderTotalValue(o){return firstValue(o,["order_total","orderTotal","total","totalAmount","total_amount","price"],0)}
function totalPaidValue(o){return firstValue(o,["total_paid","totalPaid","paid","paid_amount"],0)}
function customerPhotos(o){const value=firstValue(o,["customer_photos","customerPhotos","customer_images","customerImages"],[]);return Array.isArray(value)?value:[]}
function mockupPhotos(o){const value=firstValue(o,["mockup_photos","mockupPhotos","mockups","mockup_images","mockupImages"],[]);return Array.isArray(value)?value:[]}
function getTotal(o){return Number(orderTotalValue(o))||getItems(o).reduce((sum,i)=>sum+(Number(i.itemTotal)||((Number(i.quantity)||1)*(Number(i.unitPrice)||0))),0)}
function getPaid(o){return Number(totalPaidValue(o))||0}
function getBalance(o){return Math.max(0,getTotal(o)-getPaid(o))}
function formatDate(value){if(!value)return"No due date";const d=new Date(String(value).length===10?value+"T00:00:00":value);return Number.isNaN(d.getTime())?"No due date":d.toLocaleDateString("en-GB")}
function statusClass(status){return String(status||"").toLowerCase().replace(/\s+/g,"-")}
function invoiceNumber(o){const m=String(orderNumber(o)||"").match(/(\d+)$/);return "INV-"+String(m?Number(m[1]):1).padStart(4,"0")}

async function checkLogin(){
 const{data,error}=await supabase.auth.getSession();
 if(error||!data.session){location.href="index.html";return false}
 return true;
}

async function load(){
 const{data,error}=await supabase.from("orders").select("*");
 if(error){
  $("summary").textContent="Orders could not be loaded";
  $("orders").innerHTML=`<div class="empty"><strong>Unable to load orders.</strong><br>${esc(error.message)}</div>`;
  return;
 }
 orders=(data||[]).sort((a,b)=>new Date(dateNeeded(b)||orderDate(b)||0)-new Date(dateNeeded(a)||orderDate(a)||0));
 render();
}

function render(){
 const q=$("search").value.toLowerCase().trim();
 const list=orders.filter(o=>{
  const status=String(orderStatus(o));
  if(filter!=="all"&&status!==filter)return false;
  if(!q)return true;
  return[orderNumber(o),customerName(o),customerContact(o),orderSource(o),orderNotes(o),socialUsername(o),...getItems(o).flatMap(i=>[i.product,i.size,i.colour,i.personalisation])].join(" ").toLowerCase().includes(q);
 });
 $("summary").textContent=`${list.length} order${list.length===1?"":"s"}`;
 if(!list.length){$("orders").innerHTML='<div class="empty">📦<br><strong>No orders found</strong></div>';return}
 $("orders").innerHTML=list.map(o=>{
  const status=orderStatus(o);
  const products=getItems(o).map(i=>i.product).filter(Boolean).join(", ")||"No product";
  const invoiceButton=["Ready","Completed"].includes(status)
   ?`<button class="invoice" data-act="invoice" data-id="${esc(o.id)}">🧾 Invoice</button>`:"";
  return`<article class="orderCard">
   <div class="orderTop"><div><div class="orderNo">${esc(orderNumber(o)||"MTYD-????")}</div><div class="customer">${esc(customerName(o)||"Customer name not entered")}</div></div><span class="status ${statusClass(status)}">${esc(status)}</span></div>
   <div class="meta">📅 ${esc(formatDate(dateNeeded(o)))} · 🛍️ ${esc(products)}<br>💷 Total ${money(getTotal(o))} · 💳 Paid ${money(getPaid(o))} · 💰 Balance ${money(getBalance(o))}</div>
   <div class="actions"><button class="view" data-act="view" data-id="${esc(o.id)}">👁 View</button><button class="edit" data-act="edit" data-id="${esc(o.id)}">✏️ Edit</button>${invoiceButton}<button class="delete" data-act="delete" data-id="${esc(o.id)}">🗑 Delete</button></div>
  </article>`;
 }).join("");
}

/* ---------------- ITEMS ---------------- */
function itemEditor(item,index){
 const yes=String(item.personalised||"No")==="Yes";
 return`<div class="itemCard"><div class="itemTitle">📦 Item ${index+1}</div><div class="itemGrid">
  <div class="wide"><label>Product</label><input class="ep" value="${esc(item.product||"")}"></div>
  <div><label>Quantity</label><input class="eq" type="number" min="1" value="${Number(item.quantity)||1}"></div>
  <div><label>Unit Price (£)</label><input class="eprice" type="number" step="0.01" value="${Number(item.unitPrice)||0}"></div>
  <div><label>Item Total (£)</label><input class="etotal" readonly value="${(Number(item.itemTotal)||((Number(item.quantity)||1)*(Number(item.unitPrice)||0))).toFixed(2)}"></div>
  <div><label>Size</label><input class="esize" value="${esc(item.size||"")}"></div>
  <div><label>Colour / Theme</label><input class="ecolour" value="${esc(item.colour||"")}"></div>
  <div><label>Personalised?</label><select class="eyes"><option value="No">No</option><option value="Yes">Yes</option></select></div>
  <div class="wide pbox" style="display:${yes?"block":"none"}"><label>What personalisation?</label><textarea class="epersonal">${esc(item.personalisation||"")}</textarea></div>
 </div><button type="button" class="removeItem">🗑 Remove Item</button></div>`;
}
function collectItems(){
 return[...document.querySelectorAll("#editItems .itemCard")].map(card=>{
  const quantity=Number(card.querySelector(".eq").value)||1,price=Number(card.querySelector(".eprice").value)||0,personalised=card.querySelector(".eyes").value;
  return{product:card.querySelector(".ep").value.trim(),quantity,unitPrice:price,itemTotal:quantity*price,size:card.querySelector(".esize").value.trim(),colour:card.querySelector(".ecolour").value.trim(),personalised,personalisation:personalised==="Yes"?card.querySelector(".epersonal").value.trim():""};
 });
}
function wireItems(){
 document.querySelectorAll("#editItems .itemCard").forEach((card,index)=>{
  const select=card.querySelector(".eyes");select.value=editing.items[index]?.personalised||"No";
  select.onchange=()=>card.querySelector(".pbox").style.display=select.value==="Yes"?"block":"none";
  const recalcItem=()=>{const q=Number(card.querySelector(".eq").value)||1,p=Number(card.querySelector(".eprice").value)||0;card.querySelector(".etotal").value=(q*p).toFixed(2);recalc()};
  card.querySelector(".eq").oninput=recalcItem;card.querySelector(".eprice").oninput=recalcItem;
  card.querySelector(".removeItem").onclick=()=>{if(editing.items.length<=1){alert("You must have at least one item.");return}editing.items.splice(index,1);renderEditItems()};
 });
}
function renderEditItems(){$("editItems").innerHTML=editing.items.map(itemEditor).join("");wireItems();recalc()}

/* ---------------- PAYMENTS ---------------- */
function paymentHtml(list){
 if(!Array.isArray(list)||!list.length)return'<div class="paymentRow">No payments recorded yet.</div>';
 return list.map(p=>`<div class="paymentRow"><strong>${money(p.amount)}</strong> · ${esc(p.method||"")} · ${esc(p.date||"")}${p.notes?" · "+esc(p.notes):""}</div>`).join("");
}

/* ---------------- IMAGE PROCESSING ---------------- */
function fileToImageObject(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
    canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
    resolve({name:file.name,type:"image/jpeg",data:canvas.toDataURL("image/jpeg",.72)});
   };
   img.onerror=()=>reject(new Error("One of the selected images could not be read."));
   img.src=reader.result;
  };
  reader.onerror=()=>reject(new Error("Could not read the selected image."));
  reader.readAsDataURL(file);
 });
}
async function filesToJson(input){const files=[...(input?.files||[])],output=[];for(const file of files)output.push(await fileToImageObject(file));return output}
function getPhotoSrc(photo){if(typeof photo==="string")return photo;return photo?.data||photo?.url||photo?.src||photo?.image||photo?.dataUrl||""}
function photoSectionHtml(title,type,list,inputId){
 const label=type==="mockup"?"mock-ups":"customer photos",photos=Array.isArray(list)?list:[];
 return`<section class="editCard photoSection" data-photo-section="${type}"><h3>${title}</h3>${photos.length?`<div class="photoGrid">${photos.map((photo,index)=>{const src=getPhotoSrc(photo);return`<div class="photoWrap"><img src="${esc(src)}" alt="${esc(label)}" class="photoPreview" data-photo-type="${type}" data-photo-index="${index}"><button type="button" class="photoRemove" data-photo-remove="${type}" data-photo-index="${index}" title="Remove this image">×</button></div>`}).join("")}</div>`:`<div class="noPhotos">No ${label} saved for this order.</div>`}<div class="uploadBox"><label>Add more ${label}</label><input id="${inputId}" type="file" multiple accept="image/*"><div class="photoHint">Existing images stay saved. New images are added to them.</div></div></section>`;
}
function attachPhotoSection(type){
 const inputId=type==="mockup"?"editMockupPhotos":"editCustomerPhotos",input=$(inputId);if(!input)return;
 input.onchange=async()=>{if(!input.files.length)return;try{const added=await filesToJson(input);if(type==="mockup")editing.mockup_photos.push(...added);else editing.customer_photos.push(...added);refreshPhotoSection(type)}catch(error){alert("Could not add the image(s).\n\n"+error.message)}};
 document.querySelectorAll(`[data-photo-remove="${type}"]`).forEach(button=>button.onclick=()=>{const index=Number(button.dataset.photoIndex);if(type==="mockup")editing.mockup_photos.splice(index,1);else editing.customer_photos.splice(index,1);refreshPhotoSection(type)});
 document.querySelectorAll(`.photoPreview[data-photo-type="${type}"]`).forEach(img=>img.onclick=()=>openImageViewer(img.src));
}
function refreshPhotoSection(type){
 const section=document.querySelector(`[data-photo-section="${type}"]`);if(!section)return;
 const title=type==="mockup"?"🎨 Mock Ups":"📸 Customer Photos",list=type==="mockup"?editing.mockup_photos:editing.customer_photos,inputId=type==="mockup"?"editMockupPhotos":"editCustomerPhotos";
 const wrapper=document.createElement("div");wrapper.innerHTML=photoSectionHtml(title,type,list,inputId);section.replaceWith(wrapper.firstElementChild);attachPhotoSection(type);
}
function openImageViewer(src){
 const root=document.createElement("div");root.className="imageViewer";root.innerHTML=`<button type="button" class="imageViewerClose" aria-label="Close">×</button><img src="${esc(src)}" alt="Full size image">`;
 document.body.appendChild(root);root.querySelector(".imageViewerClose").onclick=()=>root.remove();root.onclick=e=>{if(e.target===root)root.remove()};
}

/* ---------------- EDIT ORDER ---------------- */
function recalc(){
 const orderItems=collectItems(),orderTotal=orderItems.reduce((sum,item)=>sum+item.itemTotal,0),paidAmount=Number($("ePaid")?.value)||0;
 $("totals").textContent=`Total: ${money(orderTotal)} · Paid: ${money(paidAmount)} · Balance: ${money(Math.max(0,orderTotal-paidAmount))}`;
 $("ePayStatus").value=paidAmount<=0?"Not Paid":paidAmount>=orderTotal?"Paid in Full":"Deposit Paid";
}
function openEditor(order){
 editing=structuredClone(order);
 editing.order_number=orderNumber(order);editing.customer_name=customerName(order);editing.customer_contact=customerContact(order);editing.order_source=orderSource(order);editing.social_username=socialUsername(order);editing.order_notes=orderNotes(order);editing.order_status=orderStatus(order);editing.date_needed=dateNeeded(order);editing.order_date=orderDate(order);editing.order_total=orderTotalValue(order);editing.total_paid=totalPaidValue(order);editing.customer_photos=customerPhotos(order);editing.mockup_photos=mockupPhotos(order);
 editing.items=Array.isArray(editing.items)&&editing.items.length?editing.items:[{product:"",quantity:1,unitPrice:0,itemTotal:0,size:"",colour:"",personalised:"No",personalisation:""}];
 editing.customer_photos=structuredClone(editing.customer_photos||[]);editing.mockup_photos=structuredClone(editing.mockup_photos||[]);
 payments=Array.isArray(editing.payments)?structuredClone(editing.payments):[];
 $("editorRoot").innerHTML=`<div class="backdrop"><div class="editor">
 <div class="editorHead"><h2>✏️ Edit ${esc(editing.order_number||"Order")}</h2><button class="close" id="closeEdit">×</button></div>
 <section class="editCard"><h3>👤 Customer Details</h3><div class="grid">
  <div><label>Customer Name</label><input id="eName" value="${esc(editing.customer_name||"")}"></div>
  <div><label>Contact</label><input id="eContact" value="${esc(editing.customer_contact||"")}"></div>
  <div><label>Where Ordered From</label><select id="eSource"><option>Facebook</option><option>Instagram</option><option>Snapchat</option><option>TikTok</option><option>Website</option><option>Other</option></select></div>
  <div><label>Social Username</label><input id="eSocial" value="${esc(editing.social_username||"")}"></div>
 </div></section>
 <section class="editCard"><h3>📦 Items Ordered</h3><div id="editItems">${editing.items.map(itemEditor).join("")}</div><button class="addItem" id="addItem" type="button">➕ Add Another Item</button></section>
 <section class="editCard"><h3>📝 Order Details</h3><div class="grid">
  <div><label>Order Number</label><input value="${esc(editing.order_number||"")}" readonly></div>
  <div><label>Order Date</label><input id="eOrderDate" type="date" value="${esc(String(editing.order_date||"").slice(0,10))}"></div>
  <div><label>Date Needed By</label><input id="eNeeded" type="date" value="${esc(String(editing.date_needed||"").slice(0,10))}"></div>
  <div class="full"><label>Order Notes</label><textarea id="eNotes">${esc(editing.order_notes||"")}</textarea></div>
 </div></section>
 ${photoSectionHtml("📸 Customer Photos","customer",editing.customer_photos,"editCustomerPhotos")}
 ${photoSectionHtml("🎨 Mock Ups","mockup",editing.mockup_photos,"editMockupPhotos")}
 <section class="editCard"><h3>💷 Payment</h3><div class="grid">
  <div><label>Total Paid (£)</label><input id="ePaid" type="number" step="0.01" value="${Number(editing.total_paid)||0}"></div>
  <div><label>Payment Status</label><select id="ePayStatus"><option>Not Paid</option><option>Deposit Paid</option><option>Paid in Full</option></select></div>
 </div><div id="totals" class="totals"></div><div id="paymentHistory">${paymentHtml(payments)}</div>
 <button class="addItem" id="addPayment" type="button">💗 + Add Payment</button>
 <div id="paymentForm" style="display:none"><div class="grid"><div><label>Date</label><input id="pDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Amount (£)</label><input id="pAmount" type="number" step="0.01"></div><div><label>Method</label><select id="pMethod"><option>Cash</option><option>Bank Transfer</option><option>Card</option><option>PayPal</option><option>Other</option></select></div><div><label>Notes</label><input id="pNotes"></div></div><button class="addItem" id="savePayment" type="button">Save Payment</button></div>
 </section>
 <section class="editCard"><h3>🚚 Collection / Delivery</h3><div class="grid">
  <div><label>Delivery Method</label><select id="eDelivery"><option>Collection</option><option>Local Delivery</option><option>Royal Mail</option><option>Evri</option><option>InPost</option></select></div>
  <div><label>Tracking Number</label><input id="eTracking" value="${esc(editing.tracking_number||"")}"></div>
  <div><label>Address Line 1</label><input id="eA1" value="${esc(editing.address1||"")}"></div><div><label>Address Line 2</label><input id="eA2" value="${esc(editing.address2||"")}"></div>
  <div><label>Town / City</label><input id="eTown" value="${esc(editing.town||"")}"></div><div><label>County</label><input id="eCounty" value="${esc(editing.county||"")}"></div><div><label>Postcode</label><input id="ePost" value="${esc(editing.postcode||"")}"></div>
 </div></section>
 <section class="editCard"><h3>✨ Order Progress</h3><label>Status</label><select id="eStatus"><option>New Order</option><option>Designing</option><option>Making</option><option>Ready</option><option>Completed</option></select></section>
 <div id="editMsg" class="msg"></div><div class="editorActions"><button class="cancel" id="cancelEdit" type="button">Cancel</button><button class="save" id="saveEdit" type="button">💗 Save Changes</button></div>
 </div></div>`;
 $("eSource").value=editing.order_source||"Facebook";$("eDelivery").value=editing.delivery_method||"Collection";$("eStatus").value=editing.order_status||"New Order";$("ePayStatus").value=editing.payment_status||"Not Paid";
 wireItems();recalc();attachPhotoSection("customer");attachPhotoSection("mockup");
 $("closeEdit").onclick=closeEditor;$("cancelEdit").onclick=closeEditor;
 $("addItem").onclick=()=>{editing.items.push({product:"",quantity:1,unitPrice:0,itemTotal:0,size:"",colour:"",personalised:"No",personalisation:""});renderEditItems()};
 $("ePaid").oninput=recalc;
 $("addPayment").onclick=()=>{$("paymentForm").style.display=$("paymentForm").style.display==="none"?"block":"none"};
 $("savePayment").onclick=()=>{const amount=Number($("pAmount").value)||0;if(amount<=0){alert("Enter a payment amount.");return}payments.push({date:$("pDate").value,amount,method:$("pMethod").value,notes:$("pNotes").value});$("paymentHistory").innerHTML=paymentHtml(payments);$("pAmount").value="";$("pNotes").value="";$("paymentForm").style.display="none";$("ePaid").value=payments.reduce((sum,p)=>sum+(Number(p.amount)||0),0).toFixed(2);recalc()};
 $("saveEdit").onclick=saveEdit;
}
function closeEditor(){$("editorRoot").innerHTML="";editing=null;payments=[]}

/* ---------------- SAVE EDIT ---------------- */
async function saveEdit(){
 const button=$("saveEdit"),message=$("editMsg");button.disabled=true;message.style.display="none";
 try{
  const orderItems=collectItems(),orderTotal=orderItems.reduce((sum,item)=>sum+item.itemTotal,0),totalPaid=Number($("ePaid").value)||0,status=$("eStatus").value;
  const payload={customer_name:$("eName").value.trim(),customer_contact:$("eContact").value.trim(),order_source:$("eSource").value,social_username:$("eSocial").value.trim(),items:orderItems,order_date:$("eOrderDate").value||null,date_needed:$("eNeeded").value||null,order_notes:$("eNotes").value.trim(),order_total:orderTotal,total_paid:totalPaid,remaining_balance:Math.max(0,orderTotal-totalPaid),payment_status:totalPaid<=0?"Not Paid":totalPaid>=orderTotal?"Paid in Full":"Deposit Paid",payments,delivery_method:$("eDelivery").value,tracking_number:$("eTracking").value.trim(),address1:$("eA1").value.trim(),address2:$("eA2").value.trim(),town:$("eTown").value.trim(),county:$("eCounty").value.trim(),postcode:$("ePost").value.trim(),order_status:status,completed:status==="Completed",customer_photos:editing.customer_photos,mockup_photos:editing.mockup_photos,updated_at:new Date().toISOString()};
  const{error}=await supabase.from("orders").update(payload).eq("id",editing.id);
  if(error)throw error;
  closeEditor();await load();
 }catch(error){message.textContent="Could not save the order: "+error.message;message.style.display="block";button.disabled=false}
}

/* ---------------- VIEW ORDER ---------------- */
function viewPhotoSection(title,list){
 const photos=Array.isArray(list)?list:[];
 return`<section class="editCard"><h3>${title} ${photos.length?`(${photos.length})`:""}</h3>${photos.length?`<div class="photoHint">Tap an image to view it full screen.</div>`:""}${photos.length?`<div class="photoGrid">${photos.map(photo=>{const src=getPhotoSrc(photo);return`<div class="photoWrap"><img src="${esc(src)}" alt="Order image" class="viewPhoto" data-src="${esc(src)}" onerror="this.style.display='none';"></div>`}).join("")}</div>`:`<div class="noPhotos">No images saved.</div>`}</section>`;
}
function attachViewPhotos(){document.querySelectorAll(".viewPhoto").forEach(img=>img.onclick=()=>openImageViewer(img.dataset.src))}
function viewOrder(order){
 const orderItems=getItems(order);
 $("editorRoot").innerHTML=`<div class="backdrop"><div class="editor">
 <div class="editorHead"><h2>📦 ${esc(orderNumber(order)||"Order")} — ${esc(customerName(order)||"")}</h2><button class="close" id="closeView">×</button></div>
 <section class="editCard"><h3>👤 Customer</h3><div class="viewLine"><strong>${esc(customerName(order)||"—")}</strong><br>${esc(customerContact(order)||"—")}<br>${esc(orderSource(order)||"—")}${socialUsername(order)?" · "+esc(socialUsername(order)):""}</div></section>
 <section class="editCard"><h3>📦 Items</h3>${orderItems.length?orderItems.map((item,index)=>`<div class="viewItem"><strong>Item ${index+1}: ${esc(item.product||"Unnamed item")}</strong><div>Quantity: ${esc(item.quantity||1)} · ${money(item.itemTotal||((Number(item.quantity)||1)*(Number(item.unitPrice)||0)))}</div>${item.size?`<div>Size: ${esc(item.size)}</div>`:""}${item.colour?`<div>Colour / Theme: ${esc(item.colour)}</div>`:""}<div><strong>Personalised: ${esc(item.personalised||"No")}</strong></div>${item.personalised==="Yes"?`<div>Personalisation: ${esc(item.personalisation||"—")}</div>`:""}</div>`).join(""):"<div>No items recorded.</div>"}</section>
 <section class="editCard"><h3>📅 Order Details</h3><div class="viewLine">Order Date: ${esc(formatDate(orderDate(order)))}<br>Date Needed By: ${esc(formatDate(dateNeeded(order)))}<br>Status: <strong>${esc(orderStatus(order))}</strong></div></section>
 ${viewPhotoSection("📸 Customer Photos",customerPhotos(order))}${viewPhotoSection("🎨 Mock Ups",mockupPhotos(order))}
 <section class="editCard"><h3>💷 Payment</h3><div class="viewLine">Total: ${money(getTotal(order))}<br>Paid: ${money(getPaid(order))}<br>Balance: ${money(getBalance(order))}</div><div style="margin-top:8px">${paymentHtml(Array.isArray(order.payments)?order.payments:[])}</div></section>
 <section class="editCard"><h3>🚚 Delivery</h3><div class="viewLine">Method: ${esc(order.delivery_method||"—")}<br>${order.tracking_number?"Tracking: "+esc(order.tracking_number):"No tracking number"}</div></section>
 <section class="editCard"><h3>📝 Notes</h3><div class="viewLine">${esc(orderNotes(order)||"No notes.")}</div></section>
 <div class="editorActions"><button class="edit" id="viewEdit" type="button">✏️ Edit This Order</button><button class="danger" id="viewDelete" type="button">🗑 Delete Order</button></div>
 </div></div>`;
 $("closeView").onclick=()=>{$("editorRoot").innerHTML=""};$("viewEdit").onclick=()=>openEditor(order);$("viewDelete").onclick=async()=>{closeEditor();await deleteOrder(order)};attachViewPhotos();
}

/* ---------------- DELETE ---------------- */
async function deleteOrder(order){
 if(!confirm(`Delete ${order.order_number||"this order"}?\n\nThis will permanently remove the order.`))return;
 const{error}=await supabase.from("orders").delete().eq("id",order.id);
 if(error){alert("Could not delete the order.\n\n"+error.message);return}
 await load();
}

/* ---------------- EVENTS ---------------- */
$("search").oninput=render;
document.querySelectorAll(".filter").forEach(button=>button.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));button.classList.add("active");filter=button.dataset.filter;render()});
$("orders").onclick=event=>{
 const button=event.target.closest("button[data-act]");if(!button)return;
 const order=orders.find(item=>String(item.id)===String(button.dataset.id));if(!order)return;
 if(button.dataset.act==="view")viewOrder(order);
 if(button.dataset.act==="edit")openEditor(order);
 if(button.dataset.act==="invoice")location.href=`invoices.html?order=${encodeURIComponent(order.id)}`;
 if(button.dataset.act==="delete")deleteOrder(order);
};
document.addEventListener("keydown",event=>{if(event.key==="Escape"){const viewer=document.querySelector(".imageViewer");if(viewer)viewer.remove();else closeEditor()}});

(async()=>{
 if(await checkLogin()){
  await load();
  supabase.channel("orders-page").on("postgres_changes",{event:"*",schema:"public",table:"orders"},()=>load()).subscribe();
 }
})();
</script>
</body>
</html>
