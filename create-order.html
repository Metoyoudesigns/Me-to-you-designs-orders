<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create New Order | Me To You Designs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/create-order.css">

</head>

<body>

<div class="page">

<header class="order-header">

<button
type="button"
class="back-button"
onclick="location.href='dashboard.html'">

←

</button>

<img
src="logo.PNG"
class="logo"
alt="Me To You Designs">

<h1>Create New Order</h1>

<div class="heart">

♡

</div>

<p>

Complete the form below to create a new customer order.

</p>

</header>

<section class="card">

<h2>👤 Customer Details</h2>

<label>Customer Name</label>

<input
id="customerName"
type="text"
placeholder="Customer name">

<label>Customer Contact</label>

<input
id="customerContact"
type="text"
placeholder="Phone number or email">

<label>Where Ordered From</label>

<select id="orderSource">

<option>Facebook</option>
<option>Instagram</option>
<option>Snapchat</option>
<option>TikTok</option>
<option>Website</option>
<option>Other</option>

</select>

<label>Social Username</label>

<input
id="socialUsername"
type="text"
placeholder="@username">

</section>

<section class="card">

<h2>📦 Items Ordered</h2>

<div id="itemsContainer">

<div class="itemCard">

<label>Product</label>

<input
type="text"
class="itemProduct"
placeholder="Example: Balloon Stack">

<label>Quantity</label>

<input
type="number"
class="itemQuantity"
value="1"
min="1">

<label>Unit Price (£)</label>

<input
type="number"
class="itemPrice"
value="0.00"
step="0.01">

<label>Item Total (£)</label>

<input
type="number"
class="itemTotal"
value="0.00"
readonly>

<label>Size (Optional)</label>

<input
type="text"
class="itemSize">

<label>Colour / Theme</label>

<input
type="text"
class="itemColour"
placeholder="Pink, Bluey, Football...">

<label>Personalised?</label>

<select class="itemPersonalised">

<option>No</option>
<option>Yes</option>

</select>

<div class="personalisationBox">

<label>Personalisation</label>

<textarea
class="itemPersonalisation"
placeholder="Name, wording or message..."></textarea>

</div>

<button
type="button"
class="removeItemButton">

🗑 Remove Item

</button>

</div>

</div>

<button
type="button"
id="addItemButton">

➕ Add Another Item

</button>

</section>

<section class="card">

<h2>📝 Order Details</h2>

<label>Order Number</label>

<input
id="orderNumber"
type="text"
readonly>

<label>Order Date</label>

<input
id="orderDate"
type="date">

<label>Date Needed By</label>

<input
id="dateNeeded"
type="date">

<label>Upload Customer Images</label>

<input
id="customerImages"
type="file"
multiple>

<label>Upload Mock Ups</label>

<input
id="mockupImages"
type="file"
multiple>

<label>Order Notes</label>

<textarea
id="orderNotes"
placeholder="Anything the customer has requested..."></textarea>

</section>

<section class="card">

<h2>💷 Payment</h2>

<label>Order Total (£)</label>

<input
id="orderTotal"
type="number"
value="0.00"
readonly>

<label>Payment Status</label>

<input
id="paymentStatus"
type="text"
value="Not Paid"
readonly>

<label>Total Paid (£)</label>

<input
id="totalPaid"
type="number"
value="0.00"
readonly>

<label>Remaining Balance (£)</label>

<input
id="remainingBalance"
type="number"
value="0.00"
readonly>

<h3>📜 Payment History</h3>

<div id="paymentHistory">

<p>No payments recorded yet.</p>

</div>

<button
type="button"
id="addPaymentButton">

💗 + Add Payment

</button>

<div
id="paymentForm"
style="display:none;">

<label>Payment Date</label>

<input
id="paymentDate"
type="date">

<label>Amount (£)</label>

<input
id="paymentAmount"
type="number"
step="0.01"
placeholder="0.00">

<label>Payment Method</label>

<select id="paymentMethod">

<option>Cash</option>
<option>Bank Transfer</option>
<option>Card</option>
<option>PayPal</option>
<option>Other</option>

</select>

<label>Payment Notes</label>

<textarea
id="paymentNotes"
placeholder="Deposit, final payment, etc."></textarea>

<button
type="button"
id="savePaymentButton">

💗 Save Payment

</button>

</div>

</section>

<section class="card">

<h2>🚚 Collection / Delivery</h2>

<label>Delivery Method</label>

<select id="deliveryMethod">

<option>Collection</option>

<option>Local Delivery</option>

<option>Royal Mail</option>

<option>Evri</option>

<option>InPost</option>

</select>

<div id="addressSection">

<label>Address Line 1</label>

<input
id="address1"
type="text">

<label>Address Line 2</label>

<input
id="address2"
type="text">

<label>Town / City</label>

<input
id="town"
type="text">

<label>County</label>

<input
id="county"
type="text">

<label>Postcode</label>

<input
id="postcode"
type="text">

</div>

</section>

<section class="card">

<h2>✨ Order Progress</h2>

<label>Order Status</label>

<select id="orderStatus">

<option>New Order</option>

<option>Designing</option>

<option>Making</option>

<option>Ready</option>

<option>Completed</option>

</select>

<div class="progressIcons">

<div>

📝

<br>

New

</div>

<div>

🎨

<br>

Designing

</div>

<div>

🛠

<br>

Making

</div>

<div>

📦

<br>

Ready

</div>

<div>

✅

<br>

Completed

</div>

</div>

</section>

<section class="card">

<button
type="button"
id="saveOrderButton">

💗 Save Order

</button>

</section>

</div>

<script type="module" src="js/create-order.js"></script>
  
</body>

</html>
